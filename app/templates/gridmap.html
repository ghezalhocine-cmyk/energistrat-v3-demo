<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENERGISTRAT V3 | Cortex GRID-MAP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { abysse: '#001529', card: '#0F172A', pub: '#10B981', alert: '#EF4444', gold: '#F59E0B' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono:['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #001529; color: white; overflow: hidden; font-family: 'Inter', sans-serif; }
        .bento-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 1.5rem; transition: all 0.3s ease; }
        #map { width: 100%; height: 100%; border-radius: 1.5rem; z-index: 10; background-color: #001529; }
        .leaflet-popup-content-wrapper { background-color: rgba(15, 23, 42, 0.9); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; backdrop-filter: blur(10px); }
        .leaflet-popup-tip { background-color: rgba(15, 23, 42, 0.9); }
        ::-webkit-scrollbar { width: 6px; } 
        ::-webkit-scrollbar-track { background: transparent; } 
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="flex h-screen w-screen text-sm">

    <aside class="w-20 bg-[#020617] border-r border-white/5 flex flex-col items-center py-6 flex-shrink-0 z-50 shadow-[5px_0_15px_rgba(0,0,0,0.5)]">
        <button onclick="window.location.href='/ops_nexus'" title="Retour au Nexus" class="w-12 h-12 rounded-xl bg-white/5 text-gray-400 hover:bg-white/10 hover:text-white flex items-center justify-center transition mb-8 border border-white/10">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-pub to-green-700 flex items-center justify-center text-white font-bold shadow-[0_0_15px_rgba(16,185,129,0.4)] mb-2">
            <i class="fa-solid fa-map-location-dot text-xl"></i>
        </div>
        <div class="text-[8px] font-bold text-pub uppercase tracking-widest text-center mt-1">GRID<br>MAP</div>
    </aside>

    <main class="flex-1 flex flex-col relative bg-abysse overflow-hidden bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-pub/5 via-abysse to-abysse">
        
        <header class="h-20 border-b border-white/5 flex items-center justify-between px-10 bg-abysse/95 backdrop-blur z-20">
            <div>
                <h2 class="text-2xl font-black text-white italic tracking-tight">Audit Capacité Réseau (IRVE)</h2>
                <p class="text-xs text-gray-400 font-mono mt-1">Connexion Open Data Enedis : Capacité d'accueil du poste de transformation local.</p>
            </div>
            <div class="flex gap-4">
                <div class="flex items-center gap-2 text-[10px] font-bold text-white bg-white/5 px-3 py-1 rounded-lg border border-white/10"><span class="w-3 h-3 rounded-full bg-pub"></span> Capacité OK (>50 kVA)</div>
                <div class="flex items-center gap-2 text-[10px] font-bold text-white bg-white/5 px-3 py-1 rounded-lg border border-white/10"><span class="w-3 h-3 rounded-full bg-alert"></span> Réseau Saturé (Extension requise)</div>
            </div>
        </header>

        <div class="p-8 h-full pb-20 flex gap-6">
            
            <!-- LISTE DES SITES -->
            <div class="w-1/3 bento-card p-0 flex flex-col h-full border-t-4 border-pub">
                <div class="p-6 border-b border-white/10 bg-white/5">
                    <h3 class="font-bold text-white uppercase tracking-widest text-xs"><i class="fa-solid fa-bolt mr-2 text-pub"></i> Parc Connecté</h3>
                </div>
                <div class="flex-1 overflow-y-auto" id="node-list">
                    <div class="p-12 text-center text-pub"><i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i><br>Analyse réseau Enedis en cours...</div>
                </div>
            </div>

            <!-- LA CARTE -->
            <div class="w-2/3 bento-card p-1 h-full relative">
                <div id="map"></div>
                <div id="map-overlay" class="absolute inset-0 bg-abysse/80 z-[2000] flex flex-col items-center justify-center rounded-[1.4rem]">
                    <i class="fa-solid fa-satellite-dish text-pub text-4xl animate-pulse mb-4"></i>
                    <p class="text-white font-bold text-sm">Géocodage des transformateurs...</p>
                </div>
            </div>

        </div>
    </main>

    <script>
        let mapInstance = null;

        async function initGridMap() {
            try {
                const res = await fetch('/api/tools/gridmap/capacity');
                const data = await res.json();
                
                const list = document.getElementById('node-list');
                list.innerHTML = '';

                if (!data.success || data.nodes.length === 0) {
                    list.innerHTML = `<div class="p-8 text-center text-gray-500">Aucun site trouvé.</div>`;
                    document.getElementById('map-overlay').style.display = 'none';
                    return;
                }

                // Initialisation Leaflet (Dark Mode)
                mapInstance = L.map('map').setView([46.603354, 1.888334], 5);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(mapInstance);

                for (let node of data.nodes) {
                    // Rendu Liste
                    const badge = node.can_host_fast_charge ? `<span class="bg-pub/20 text-pub px-2 py-1 rounded text-[9px] font-bold">Marge : ${node.residual_capacity_kva} kVA</span>` : `<span class="bg-alert/20 text-alert px-2 py-1 rounded text-[9px] font-bold">Marge : ${node.residual_capacity_kva} kVA (Saturé)</span>`;
                    
                    list.innerHTML += `
                        <div class="p-4 border-b border-white/5 hover:bg-white/5 transition cursor-pointer">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <div class="font-bold text-white text-sm">${node.name}</div>
                                    <div class="text-[10px] text-gray-500 font-mono mt-1">${node.city} | PS: ${node.power_kva} kVA</div>
                                </div>
                                ${badge}
                            </div>
                        </div>
                    `;

                    // Rendu Carte (Géocodage basique par nom de ville)
                    try {
                        if (node.city && node.city !== 'Inconnue') {
                            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${node.city}&count=1&language=fr&format=json`);
                            const geoData = await geoRes.json();
                            
                            if (geoData.results && geoData.results.length > 0) {
                                const lat = geoData.results[0].latitude;
                                const lon = geoData.results[0].longitude;
                                const color = node.can_host_fast_charge ? '#10B981' : '#EF4444';
                                
                                const marker = L.circleMarker([lat, lon], { radius: 8, color: color, fillColor: color, fillOpacity: 0.8 }).addTo(mapInstance);
                                marker.bindPopup(`
                                    <div class="text-center p-2">
                                        <b style="color:white; font-size:14px; display:block; margin-bottom:4px;">${node.name}</b>
                                        <span style="color:gray; font-size:10px;">Capacité d'accueil:</span><br>
                                        <span style="color:${color}; font-weight:bold; font-size:16px;">${node.residual_capacity_kva} kVA</span>
                                    </div>
                                `);
                            }
                        }
                    } catch(e) {}
                }

                document.getElementById('map-overlay').style.display = 'none';

            } catch(e) {
                console.error(e);
            }
        }

        document.addEventListener('DOMContentLoaded', initGridMap);
    </script>
</body>
</html>
