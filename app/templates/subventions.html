<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENERGISTRAT V12.8 | Cortex Subventions</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        abysse: '#001529', card: '#001D3D', cyan: '#00E5FF',   
                        alert: '#EF4444', success: '#10B981', steam: '#94A3B8',  
                        sub: '#00E5FF', gold: '#F59E0B'
                    },
                    fontFamily: { sans:['Inter', 'sans-serif'], mono:['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #001529; color: white; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        /* BENTO DESIGN */
        .bento-card { background: rgba(0, 29, 61, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 2.5rem; transition: all 0.3s ease; }
        .bento-card:hover { border-color: rgba(0, 229, 255, 0.5); transform: translateY(-2px); box-shadow: 0 10px 30px -10px rgba(0, 229, 255, 0.2); }
        
        /* FILTRES NEON */
        .filter-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 1rem; border: 1px solid transparent; }
        .filter-btn.active { background-color: rgba(0, 229, 255, 0.1); border-color: #00E5FF; color: #00E5FF; box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }
        
        /* ANIMATION DES CARTES */
        .aide-card { animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        ::-webkit-scrollbar { width: 6px; } 
        ::-webkit-scrollbar-track { background: transparent; } 
        ::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.3); border-radius: 3px; }
        .glow-text { text-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
    </style>
</head>
<body class="flex h-screen w-screen bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">

    <!-- SIDEBAR -->
    <aside class="w-24 bg-abysse border-r border-cyan/20 flex flex-col items-center py-8 z-50 flex-shrink-0 shadow-[10px_0_30px_rgba(0,0,0,0.5)]">
        
        <!-- BOUTON RETOUR INTELLIGENT -->
        <button onclick="window.smartGoBack()" class="w-12 h-12 rounded-[1rem] bg-card border border-white/10 text-gray-400 hover:text-white hover:border-white hover:bg-white/10 transition mb-10 flex items-center justify-center text-xl shadow-lg" title="Retour au Dashboard">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        
        <!-- LOGO SATELLITE (SUBVENTIONS) -->
        <div class="w-14 h-14 rounded-[1.2rem] bg-gradient-to-br from-cyan to-blue-600 border border-cyan/50 text-abysse flex items-center justify-center text-2xl shadow-[0_0_20px_rgba(0,229,255,0.5)] relative overflow-hidden group">
            <i class="fa-solid fa-hand-holding-dollar group-hover:scale-110 transition duration-300"></i>
            <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
        </div>
        
    </aside>

    <!-- MAIN WRAPPER -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        
        <!-- HEADER -->
        <header class="h-24 border-b border-cyan/20 flex items-center justify-between px-10 bg-abysse/90 backdrop-blur z-40 flex-shrink-0 shadow-md">
            <div class="flex-shrink-0">
                <h2 class="text-2xl font-black text-white tracking-tight drop-shadow-lg flex items-center gap-3">
                    <i class="fa-solid fa-satellite text-cyan glow-text"></i> CORTEX<span class="text-cyan">.AIDES</span>
                </h2>
                <p class="text-[10px] text-gray-400 font-mono mt-1 uppercase tracking-widest flex items-center gap-2">
                    <span id="god-mode-indicator" class="hidden text-alert animate-pulse font-bold">● GOD MODE</span> 
                    Recherche de CEE & Fonds Vert
                </p>
            </div>
            
            <div class="flex-1 flex justify-center">
                <div class="bg-card border border-cyan/30 px-8 py-3 rounded-[2rem] text-sm font-bold text-cyan shadow-[0_0_15px_rgba(0,229,255,0.15)] flex items-center gap-3">
                    <i class="fa-solid fa-magnifying-glass-location"></i> Analyse multi-sites de l'intégralité du parc
                </div>
            </div>

            <div class="flex items-center justify-end">
                <div class="bg-gradient-to-r from-card to-success/10 border border-success/30 px-8 py-3 rounded-[2rem] text-right shadow-[0_0_20px_rgba(16,185,129,0.2)]">
                    <span class="text-[10px] text-gray-400 uppercase font-bold block tracking-widest mb-1">Enveloppe Sécurisable</span>
                    <span class="text-3xl font-black text-success font-mono drop-shadow-md" id="val-total-aides"><i class="fa-solid fa-spinner fa-spin text-sm"></i></span>
                </div>
            </div>
        </header>

        <!-- FILTRES NEON -->
        <div class="px-10 py-5 border-b border-white/5 bg-abysse/80 flex gap-4 justify-center z-30 shadow-sm shrink-0">
            <button onclick="applyFilter('ALL')" id="btn-filt-ALL" class="filter-btn active px-6 py-2 text-[10px] font-black uppercase tracking-widest text-cyan">Tout le Parc</button>
            <button onclick="applyFilter('ELIGIBLE')" id="btn-filt-ELIGIBLE" class="filter-btn px-6 py-2 text-[10px] font-black uppercase tracking-widest text-gray-500 hover:text-white">Aides Détectées</button>
            <button onclick="applyFilter('NON_ELIGIBLE')" id="btn-filt-NON_ELIGIBLE" class="filter-btn px-6 py-2 text-[10px] font-black uppercase tracking-widest text-gray-500 hover:text-white">Déjà Optimisés</button>
            <button onclick="applyFilter('MISSING_DATA')" id="btn-filt-MISSING_DATA" class="filter-btn px-6 py-2 text-[10px] font-black uppercase tracking-widest text-gray-500 hover:text-white">Données Manquantes</button>
        </div>

        <div class="flex-1 overflow-y-auto p-10 pb-32">
            
            <!-- LOADER CORTEX -->
            <div id="loader" class="flex flex-col items-center justify-center py-32 text-cyan">
                <i class="fa-solid fa-radar text-6xl mb-6 animate-pulse opacity-50"></i>
                <p class="font-black font-mono tracking-widest uppercase text-sm glow-text">Balayage des fiches CEE en cours...</p>
                <p class="text-[10px] text-gray-500 mt-2 uppercase tracking-widest">Analyse de la Data Unity</p>
            </div>

            <!-- CONTAINER DES CARTES -->
            <div class="grid grid-cols-1 gap-8 max-w-6xl mx-auto" id="results-container">
                <!-- Injecté par JavaScript -->
            </div>

        </div>
    </main>

    <!-- TOAST ENGINE -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[300] flex flex-col gap-2 pointer-events-none w-11/12 md:w-auto max-w-md"></div>

<script>
    // ==========================================
    // 1. MOTEUR UTILITAIRE & GOD MODE
    // ==========================================
    function getApiUrl(basePath) {
        const urlParams = new URLSearchParams(window.location.search);
        const forceTenant = urlParams.get('force_tenant');
        if (!forceTenant) return basePath;
        return basePath + (basePath.includes('?') ? '&' : '?') + 'force_tenant=' + encodeURIComponent(forceTenant);
    }

    const App = {
        toast: function(msg, type='info') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const colors = { 
                success: 'bg-success border-success/50 text-abysse', 
                error: 'bg-alert border-alert/50 text-white', 
                warning: 'bg-gold border-gold/50 text-abysse',
                info: 'bg-cyan border-cyan/50 text-abysse' 
            };
            const icons = { success: 'fa-check', error: 'fa-triangle-exclamation', warning: 'fa-bolt', info: 'fa-info' };
            
            const el = document.createElement('div');
            el.className = `${colors[type] || colors.info} px-6 py-4 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] text-xs font-black tracking-wide border flex items-center gap-3 transform transition-all duration-300 -translate-y-10 opacity-0 pointer-events-auto backdrop-blur-md`;
            el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-lg"></i> <span>${msg}</span>`;
            container.appendChild(el);
            
            requestAnimationFrame(() => el.classList.remove('-translate-y-10', 'opacity-0'));
            setTimeout(() => { el.classList.add('opacity-0', '-translate-y-10'); setTimeout(() => el.remove(), 300); }, 4000);
        }
    };

    window.smartGoBack = function() {
        const forceTenant = new URLSearchParams(window.location.search).get('force_tenant');
        if (forceTenant && forceTenant !== 'ALL') {
            window.location.href = `/ops_nexus?force_tenant=${encodeURIComponent(forceTenant)}`;
        } else {
            window.location.href = '/ops_nexus';
        }
    };

    let GLOBAL_DATA =[];

    // ==========================================
    // 2. INGESTION ET SCAN DU PARC
    // ==========================================
    document.addEventListener('DOMContentLoaded', async () => {
        const forceTenant = new URLSearchParams(window.location.search).get('force_tenant');
        if(forceTenant && forceTenant !== 'ALL') {
            const ind = document.getElementById('god-mode-indicator');
            if(ind) ind.classList.remove('hidden');
        }

        try {
            App.toast("CORTEX : Interrogation des algorithmes ADEME / CEE...", "info");
            
            // Appel direct à l'API qui contient l'intelligence CEE
            const res = await fetch(getApiUrl('/api/tools/subventions'));
            const data = await res.json();
            
            document.getElementById('loader').style.display = 'none';
            
            if (!data?.success || !data?.results || data.results.length === 0) {
                document.getElementById('results-container').innerHTML = `
                    <div class="bento-card p-12 text-center text-gray-500 border-dashed border-2 border-white/10 flex flex-col items-center justify-center">
                        <i class="fa-solid fa-folder-open text-6xl mb-4 text-cyan/30"></i> 
                        <span class="text-lg font-mono text-white">Le scan n'a détecté aucun site dans la Base 3D.</span>
                        <span class="text-sm mt-2">Vérifiez le Data Unity du client.</span>
                    </div>`;
                document.getElementById('val-total-aides').innerText = "0 €";
                return;
            }

            // Affichage de l'enveloppe globale sécurisable (Calculée par le backend)
            const formatter = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
            document.getElementById('val-total-aides').innerText = formatter.format(data.total_enveloppe);
            
            GLOBAL_DATA = data.results;
            
            App.toast(`Scan terminé : ${GLOBAL_DATA.length} sites audités.`, "success");
            
            // Affichage initial
            applyFilter('ALL');

        } catch(e) { 
            console.error(e);
            document.getElementById('loader').style.display = 'none';
            document.getElementById('results-container').innerHTML = `
                <div class="bento-card p-8 border-l-4 border-alert bg-alert/10 flex items-center gap-4">
                    <i class="fa-solid fa-triangle-exclamation text-4xl text-alert"></i> 
                    <div>
                        <h3 class="text-xl font-black text-white">CORTEX HORS LIGNE</h3>
                        <p class="text-sm text-gray-300 font-mono mt-1">Impossible de contacter le moteur de subventions.</p>
                    </div>
                </div>`;
            App.toast("Erreur de connexion CORTEX", "error");
        }
    });

    // ==========================================
    // 3. FILTRES ET RENDU (UI)
    // ==========================================
    window.applyFilter = function(filterType) {
        // Style des boutons
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('active');
            b.classList.add('text-gray-500', 'bg-transparent');
            b.classList.remove('text-cyan');
        });
        const activeBtn = document.getElementById('btn-filt-' + filterType);
        if(activeBtn) {
            activeBtn.classList.add('active', 'text-cyan');
            activeBtn.classList.remove('text-gray-500', 'bg-transparent');
        }
        
        renderAides(filterType);
    }

    function renderAides(filterType) {
        const container = document.getElementById('results-container');
        container.innerHTML = '';

        const filteredData = filterType === 'ALL' ? GLOBAL_DATA : GLOBAL_DATA.filter(s => s.status === filterType);

        if(filteredData.length === 0) {
            container.innerHTML = `<div class="p-12 text-center text-gray-500 font-mono italic text-lg bg-card/30 rounded-3xl border border-white/5">Aucun actif ne correspond à ce filtre.</div>`;
            return;
        }

        const formatter = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });

        filteredData.forEach((site, index) => {
            const delay = index * 0.05; // Animation en cascade
            
            // CAS 1 : DONNÉES MANQUANTES (Surface manquante)
            if (site.status === "MISSING_DATA") {
                container.innerHTML += `
                    <div class="bento-card p-8 border-l-4 border-alert aide-card shadow-[0_10px_30px_rgba(239,68,68,0.1)]" style="animation-delay: ${delay}s">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="text-xl font-black text-white flex items-center gap-3"><i class="fa-solid fa-building-circle-exclamation text-alert"></i> ${site.name}</h3>
                                <p class="text-xs text-gray-400 font-mono mt-2 bg-black/40 inline-block px-3 py-1 rounded-lg border border-white/5">PDL: ${site.pdl} | ${site.city}</p>
                            </div>
                            <span class="bg-alert/10 border border-alert/30 text-alert px-3 py-1 rounded-lg text-[10px] font-bold uppercase tracking-widest flex items-center gap-2">
                                <i class="fa-solid fa-ban"></i> Audit Bloqué
                            </span>
                        </div>
                        <div class="mt-6 p-4 bg-alert/5 rounded-xl border border-alert/20 flex items-center justify-between">
                            <p class="text-xs text-gray-300 font-mono"><span class="text-alert font-bold">Raison :</span> ${site.reason}</p>
                            <a href="${getApiUrl('/settings')}" class="text-[10px] font-black uppercase tracking-widest text-alert bg-alert/10 border border-alert/30 hover:bg-alert hover:text-abysse px-6 py-3 rounded-xl transition shadow-lg">
                                Compléter la Data Unity
                            </a>
                        </div>
                    </div>
                `;
            } 
            // CAS 2 : NON ÉLIGIBLE (Déjà optimisé)
            else if (site.status === "NON_ELIGIBLE") {
                container.innerHTML += `
                    <div class="bento-card p-8 border-l-4 border-gray-600 aide-card bg-white/5 opacity-70 hover:opacity-100 transition" style="animation-delay: ${delay}s">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="text-xl font-black text-gray-300 flex items-center gap-3"><i class="fa-solid fa-building-circle-check text-gray-500"></i> ${site.name}</h3>
                                <p class="text-xs text-gray-500 font-mono mt-2 bg-black/40 inline-block px-3 py-1 rounded-lg border border-white/5">PDL: ${site.pdl} | ${site.city}</p>
                            </div>
                            <span class="bg-gray-800 border border-gray-600 text-gray-400 px-3 py-1 rounded-lg text-[10px] font-bold uppercase tracking-widest flex items-center gap-2">
                                <i class="fa-solid fa-check-double"></i> Site Optimisé
                            </span>
                        </div>
                        <p class="text-xs text-gray-500 mt-6 font-mono bg-black/30 p-3 rounded-lg border border-white/5"><span class="text-gray-400 font-bold">Diagnostic :</span> ${site.reason}</p>
                    </div>
                `;
            }
            // CAS 3 : ÉLIGIBLE (Affichage des Fiches ADEME / CEE remontées par le Backend)
            else if (site.status === "ELIGIBLE") {
                let aidesHtml = "";
                site.aides.forEach(aide => {
                    // Attribution d'une icône selon le code de l'aide
                    let icon = "fa-file-invoice-dollar";
                    let iconColor = "text-cyan";
                    if(aide.code.includes("116")) { icon = "fa-microchip"; iconColor = "text-cyan"; } // GTB
                    if(aide.code.includes("101")) { icon = "fa-house-chimney"; iconColor = "text-gold"; } // Isolation
                    if(aide.code.includes("ADEME")) { icon = "fa-leaf"; iconColor = "text-success"; } // Fonds Chaleur

                    aidesHtml += `
                        <div class="bg-abysse/80 p-5 rounded-2xl border border-white/10 flex justify-between items-center group hover:border-cyan/50 hover:bg-abysse transition shadow-inner">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-xl shadow-md ${iconColor}">
                                    <i class="fa-solid ${icon}"></i>
                                </div>
                                <div>
                                    <div class="text-[10px] font-black ${iconColor} uppercase tracking-widest mb-1 flex items-center gap-2">
                                        FICHE ${aide.code}
                                    </div>
                                    <div class="text-sm font-black text-white">${aide.nom}</div>
                                    <div class="text-[10px] text-gray-400 mt-1 font-mono">${aide.details}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-2xl font-black font-mono text-white mb-3 drop-shadow-md">+ ${formatter.format(aide.montant)}</div>
                                <button onclick="window.open(getApiUrl('/api/tools/cerfa/${site.id}/${aide.code}'), '_blank')" class="bg-white/5 border border-white/10 text-gray-300 hover:bg-cyan hover:border-cyan hover:text-abysse hover:shadow-[0_0_15px_rgba(0,229,255,0.4)] px-5 py-2 rounded-xl text-[10px] uppercase tracking-widest font-black transition flex items-center gap-2 ml-auto">
                                    <i class="fa-solid fa-file-pdf text-sm"></i> Pré-remplir CERFA
                                </button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="bento-card p-0 overflow-hidden border-t-4 border-cyan aide-card shadow-[0_20px_50px_rgba(0,0,0,0.3)]" style="animation-delay: ${delay}s">
                        <div class="bg-gradient-to-r from-card to-cyan/10 p-6 border-b border-cyan/20 flex justify-between items-center">
                            <div>
                                <h3 class="text-2xl font-black text-white drop-shadow-md">${site.name}</h3>
                                <p class="text-[10px] text-cyan font-mono mt-2 bg-cyan/10 inline-block px-3 py-1 rounded-lg border border-cyan/20">PDL: ${site.pdl} | ${site.city}</p>
                            </div>
                            <div class="text-right bg-abysse/50 p-4 rounded-2xl border border-white/10 shadow-inner">
                                <div class="text-[9px] text-gray-400 uppercase font-bold mb-1 tracking-widest">Total Sécurisable sur ce site</div>
                                <div class="text-3xl font-black text-success font-mono drop-shadow-[0_0_10px_rgba(16,185,129,0.3)]">+ ${formatter.format(site.total_site)}</div>
                            </div>
                        </div>
                        <div class="p-6 space-y-4 bg-abysse/30">
                            ${aidesHtml}
                        </div>
                    </div>
                `;
            }
        });
    }
</script>
    
</body>
</html>
