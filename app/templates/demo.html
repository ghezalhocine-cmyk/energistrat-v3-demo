<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT | Espace Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #001529; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .bento-card { 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 1.5rem; 
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }
        .bento-card:hover { border-color: rgba(0, 229, 255, 0.2); }
        .fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Badges */
        .badge-sync { background: rgba(16, 185, 129, 0.1); color: #10B981; border: 1px solid #10B981; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: bold; }
        .badge-warn { background: rgba(239, 68, 68, 0.1); color: #EF4444; border: 1px solid #EF4444; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- HEADER -->
    <header class="h-16 border-b border-white/5 flex items-center justify-between px-8 bg-[#000f1f]/90 backdrop-blur shrink-0 z-50">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-sm shadow-lg shadow-cyan-500/20">E</div>
            <div>
                <div class="font-bold tracking-widest text-sm">ENERGISTRAT</div>
                <div class="text-[10px] text-gray-400" id="header-subtitle">Espace Pilotage</div>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <div id="sync-status" class="hidden flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-[10px] text-green-400 font-mono">DATA LIVE</span>
            </div>
            <a href="/settings" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center cursor-pointer hover:bg-white/20 transition text-white" title="Paramètres">
                <i class="fa-solid fa-user text-xs"></i>
            </a>
        </div>
    </header>

    <!-- MAIN GRID -->
    <main class="flex-1 p-6 grid grid-cols-12 gap-6 overflow-y-auto fade-in">
        
        <!-- 1. IDENTITÉ TECHNIQUE -->
        <div class="col-span-3 bento-card p-6 border-l-4 border-cyan-500 flex flex-col justify-between">
            <div>
                <h3 class="text-gray-400 text-[10px] font-bold uppercase mb-2">Site & Contrat</h3>
                <div class="text-xl font-bold text-white mb-1 truncate" id="site-name">--</div>
                <div class="text-xs text-cyan-400 font-mono mb-4" id="site-pdl">PDL: --</div>
            </div>
            
            <div class="space-y-3">
                <div class="flex justify-between items-center bg-white/5 p-2 rounded">
                    <span class="text-[10px] text-gray-400">PUISSANCE</span>
                    <span class="text-xs font-bold text-white" id="site-power">-- kVA</span>
                </div>
                <div class="flex justify-between items-center bg-white/5 p-2 rounded">
                    <span class="text-[10px] text-gray-400">SEGMENT</span>
                    <span class="text-xs font-bold text-white" id="site-segment">--</span>
                </div>
                <div class="flex justify-between items-center bg-white/5 p-2 rounded">
                    <span class="text-[10px] text-gray-400">MÉTIER</span>
                    <span class="text-xs font-bold text-white truncate max-w-[120px]" id="site-naf">--</span>
                </div>
            </div>
            
            <div class="mt-4 pt-4 border-t border-white/5 text-center">
                <span id="badge-contract" class="badge-warn">MODE DÉCOUVERTE</span>
            </div>
        </div>

        <!-- 2. KPI FINANCIER -->
        <div class="col-span-3 bento-card p-6 border-t-4 border-yellow-500">
            <h3 class="text-gray-400 text-[10px] font-bold uppercase mb-2">Budget Estimé</h3>
            <div class="text-3xl font-bold text-white mb-2" id="kpi-budget">-- €</div>
            <p class="text-[10px] text-gray-500">Calculé sur flux réels</p>
            <div class="mt-4 h-1 bg-gray-700 rounded-full overflow-hidden">
                <div class="h-full bg-yellow-500 w-[60%]"></div>
            </div>
        </div>

        <!-- 3. KPI TECHNIQUE -->
        <div class="col-span-3 bento-card p-6 border-t-4 border-purple-500">
            <h3 class="text-gray-400 text-[10px] font-bold uppercase mb-2">Pointe Max (Hiver)</h3>
            <div class="text-3xl font-bold text-white mb-2" id="kpi-pmax">-- kW</div>
            <p class="text-[10px] text-red-400" id="kpi-depassement"></p>
        </div>

        <!-- 4. THERMO SCORE -->
        <div class="col-span-3 bento-card p-6 border-t-4 border-blue-500">
            <h3 class="text-gray-400 text-[10px] font-bold uppercase mb-2">Thermo-Sensibilité</h3>
            <div class="text-3xl font-bold text-white mb-2" id="kpi-thermo">--</div>
            <p class="text-[10px] text-gray-500">Ratio Hiver / Été</p>
        </div>

        <!-- 5. CHART -->
        <div class="col-span-9 bento-card p-6 min-h-[350px] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-white text-sm font-bold flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-cyan-400"></span> COURBE DE CHARGE
                </h3>
                <div class="flex gap-2">
                    <button class="px-3 py-1 bg-white/10 rounded text-[10px] hover:bg-white/20 transition">7J</button>
                    <button class="px-3 py-1 bg-white/10 rounded text-[10px] hover:bg-white/20 transition">30J</button>
                </div>
            </div>
            <div class="flex-1 w-full relative">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <!-- 6. CORTEX INSIGHT -->
        <div class="col-span-3 bento-card p-6 flex flex-col bg-gradient-to-b from-[#0F172A] to-purple-900/20 border-purple-500/30">
            <h3 class="text-white text-sm font-bold mb-4 flex items-center gap-2">
                <i class="fa-solid fa-brain text-purple-400"></i> ANALYSE CORTEX
            </h3>
            <div id="ai-content" class="flex-1 text-xs text-gray-300 leading-relaxed space-y-2 overflow-y-auto">
                <div class="animate-pulse">En attente de données...</div>
            </div>
        </div>

    </main>

    <script>
        // --- 1. INITIALISATION ---
        let mainChart;
        
        function initChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            mainChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        x: { display: false }, 
                        y: { grid: { color: 'rgba(255,255,255,0.05)' } } 
                    },
                    elements: { point: { radius: 0 } }
                }
            });
        }

        // --- 2. FONCTION D'INJECTION (CORRECTIF V2.3) ---
        function updateDashboard(data) {
            if(!data || !data.success) return;

            console.log("CORTEX PAYLOAD:", data);

            // A. Identité & Contrat
            const profil = data.kpi.profiling || {};
            const meta = data.kpi.meta || {};
            
            // PDL
            if(profil.pdl) document.getElementById('site-pdl').innerText = "PDL: " + profil.pdl;
            
            // MÉTIER (NAF) - Priorité au label
            if(profil.metier && profil.metier !== "Inconnu") {
                document.getElementById('site-naf').innerText = profil.metier;
            } else if (profil.naf_label) {
                document.getElementById('site-naf').innerText = profil.naf_label;
            }

            // SEGMENT (CORRECTIF : Câblage ajouté)
            if(profil.segment) {
                document.getElementById('site-segment').innerText = profil.segment;
            }

            // STATUT CONTRAT
            const contractBadge = document.getElementById('badge-contract');
            if(profil.contrat_actif && profil.contrat_actif.includes("OUI")) {
                contractBadge.className = "badge-sync";
                contractBadge.innerText = "CONTRAT SYNCHRONISÉ";
                document.getElementById('sync-status').classList.remove('hidden');
                
                // Si on a un nom de client réconcilié, on l'affiche
                // Note: Le backend V34 ne renvoie pas encore explicitement le "client_name" dans le top level
                // Mais on peut le déduire si besoin. Pour l'instant on garde le nom du fichier ou un défaut.
            } else {
                contractBadge.className = "badge-warn";
                contractBadge.innerText = "MODE DÉCOUVERTE";
            }

            // B. Données Techniques
            if(data.kpi.p_max) document.getElementById('kpi-pmax').innerText = Math.round(data.kpi.p_max) + " kW";
            
            // THERMO (CORRECTIF : Gestion du 0)
            if(data.kpi.thermo_score !== undefined && data.kpi.thermo_score !== null) {
                document.getElementById('kpi-thermo').innerText = data.kpi.thermo_score;
            }

            if(data.kpi.finance) document.getElementById('kpi-budget').innerText = Math.round(data.kpi.finance.budget_total).toLocaleString() + " €";

            // C. Graphique
            if(data.chart) {
                mainChart.data.labels = data.chart.labels;
                mainChart.data.datasets = [{
                    label: 'Puissance (kW)',
                    data: data.chart.values,
                    borderColor: '#00E5FF',
                    borderWidth: 1.5,
                    backgroundColor: 'rgba(0, 229, 255, 0.1)',
                    fill: true
                }];
                
                if(data.chart.limit_line && data.chart.limit_line.length > 0) {
                    mainChart.data.datasets.push({
                        label: 'Contrat',
                        data: data.chart.limit_line,
                        borderColor: '#EF4444',
                        borderWidth: 1,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false
                    });
                    
                    const pSouscrite = data.chart.limit_line[0];
                    document.getElementById('site-power').innerText = pSouscrite + " kVA";
                    
                    if(data.kpi.p_max > pSouscrite) {
                        const depassement = Math.round(data.kpi.p_max - pSouscrite);
                        document.getElementById('kpi-depassement').innerText = `⚠️ Dépassement : +${depassement} kVA`;
                    } else {
                        document.getElementById('kpi-depassement').innerText = "✅ Puissance optimisée";
                        document.getElementById('kpi-depassement').className = "text-[10px] text-green-400";
                    }
                }
                mainChart.update();
            }

            // D. IA Insight
            if(data.ai_insight) {
                document.getElementById('ai-content').innerHTML = `<div class="bg-purple-500/10 p-3 rounded border-l-2 border-purple-500">${data.ai_insight}</div>`;
            }
        }

        // --- 3. AUTO-LOAD ---
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            const cachedResult = localStorage.getItem('last_cortex_result');
            if(cachedResult) {
                try { updateDashboard(JSON.parse(cachedResult)); } catch(e) {}
            }
        });
    </script>
</body>
</html>
