<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT V3 | Syndic Manager (Live)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { theme: { extend: { colors: { abysse: '#050505', card: '#0F172A', syndic: '#6366F1', cyan: '#00E5FF', success: '#10B981', alert: '#EF4444' }, borderRadius: { 'bento': '1.5rem' } } } }</script>
    <style>
        body { background-color: #050505; color: white; overflow: hidden; }
        .bento-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); }
        .nav-item.active { background: rgba(99, 102, 241, 0.1); border-left: 3px solid #6366F1; color: white; }
        .view-section { display: none; } .view-section.active { display: grid; }
    </style>
</head>
<body class="flex h-screen w-screen font-sans text-sm">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#020617] border-r border-white/5 flex flex-col justify-between z-50 flex-shrink-0">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 rounded-full border border-syndic bg-syndic/10 flex items-center justify-center text-syndic font-bold">IM</div>
                <div><h1 class="font-bold tracking-wider text-base">IMMO<span class="text-syndic">.GEST</span></h1><p class="text-[10px] text-gray-500">Gestionnaire</p></div>
            </div>
            
            <div class="mb-6">
                <label class="text-[10px] text-gray-500 uppercase font-bold px-2 mb-1 block">Résidence Active</label>
                <select id="residence-select" onchange="loadResidence(this.value)" class="w-full bg-white/5 border border-syndic/30 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-syndic">
                    <option value="">Chargement...</option>
                </select>
            </div>

            <nav class="space-y-1">
                <button onclick="switchView('dashboard')" id="btn-dashboard" class="nav-item active w-full text-left px-4 py-3 rounded-r-xl hover:bg-white/5 text-gray-400 font-bold uppercase transition flex items-center gap-3">
                    <i class="fa-solid fa-chart-pie w-4 text-center"></i> Synthèse
                </button>
                <button onclick="switchView('contrats')" id="btn-contrats" class="nav-item w-full text-left px-4 py-3 rounded-r-xl hover:bg-white/5 text-gray-400 font-bold uppercase transition flex items-center gap-3">
                    <i class="fa-solid fa-file-contract w-4 text-center"></i> Contrats
                </button>
            </nav>
        </div>
        <div class="p-6 border-t border-white/5">
            <a href="/partner/settings" class="flex items-center gap-3 text-gray-400 hover:text-white transition"><i class="fa-solid fa-gear"></i> Administration</a>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col relative bg-abysse overflow-hidden">
        <header class="h-16 border-b border-white/5 flex items-center justify-between px-8 bg-abysse/95 backdrop-blur z-20">
            <div>
                <h2 id="header-residence" class="text-xl font-bold text-white">Sélectionnez une résidence</h2>
                <p class="text-xs text-gray-400" id="header-address">--</p>
            </div>
            <div class="bg-card border border-white/10 px-4 py-2 rounded-full">
                <span class="text-xs text-gray-400">Budget N</span>
                <span class="text-sm font-bold text-white font-mono ml-2" id="kpi-budget">-- €</span>
            </div>
        </header>

        <div class="p-8 overflow-y-auto h-full pb-20">
            <!-- VUE DASHBOARD -->
            <div id="view-dashboard" class="view-section active grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-8 bg-card rounded-[2rem] p-8 bento-card">
                    <h3 class="font-bold text-lg text-white mb-4">Suivi Budgétaire</h3>
                    <div class="h-64 w-full"><canvas id="chartBudget"></canvas></div>
                </div>
                <div class="col-span-4 bg-card rounded-[2rem] p-8 bento-card border-l-4 border-syndic">
                    <h3 class="font-bold text-lg text-white mb-4">Impact par Lot</h3>
                    <div class="space-y-4" id="tantieme-list">
                        <!-- JS Insert -->
                    </div>
                </div>
            </div>

            <!-- VUE CONTRATS -->
            <div id="view-contrats" class="view-section grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-12 bg-card rounded-[2rem] p-8 bento-card">
                    <h3 class="font-bold text-xl text-white mb-4">Contrats Actifs</h3>
                    <div id="contract-details" class="text-gray-400 text-sm">Sélectionnez une résidence pour voir les contrats.</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let FLEET_DATA = [];
        let chartInstance = null;

        window.switchView = function(viewId) {
            document.querySelectorAll('.nav-item').forEach(el => { el.classList.remove('active', 'text-white'); el.classList.add('text-gray-400'); });
            const btn = document.getElementById('btn-' + viewId);
            if(btn) { btn.classList.add('active', 'text-white'); btn.classList.remove('text-gray-400'); }
            
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active')); // Use active class for display
            const target = document.getElementById('view-' + viewId);
            if(target) target.classList.add('active');
        }

        async function loadFleet() {
            try {
                const res = await fetch('/api/dashboard/fleet');
                const data = await res.json();
                if(data.fleet) {
                    FLEET_DATA = data.fleet;
                    const sel = document.getElementById('residence-select');
                    sel.innerHTML = '<option value="">-- Choisir --</option>';
                    FLEET_DATA.forEach(s => {
                        const opt = document.createElement('option');
                        opt.value = s.id;
                        opt.innerText = s.name;
                        sel.appendChild(opt);
                    });
                    if(FLEET_DATA.length > 0) {
                        sel.value = FLEET_DATA[0].id;
                        loadResidence(FLEET_DATA[0].id);
                    }
                }
            } catch(e) { console.error(e); }
        }

        window.loadResidence = function(id) {
            const site = FLEET_DATA.find(s => s.id === id);
            if(!site) return;

            // Header
            document.getElementById('header-residence').innerText = site.name;
            document.getElementById('header-address').innerText = site.city;
            document.getElementById('kpi-budget').innerText = Math.round(site.budget).toLocaleString() + " €";

            // Tantièmes
            const budget = site.budget;
            document.getElementById('tantieme-list').innerHTML = `
                <div class="flex justify-between items-center border-b border-white/5 pb-2">
                    <div><div class="text-sm font-bold text-white">T2 (45/1000)</div></div>
                    <div class="text-right font-mono text-cyan">${Math.round(budget * 0.045)} €/an</div>
                </div>
                <div class="flex justify-between items-center border-b border-white/5 pb-2">
                    <div><div class="text-sm font-bold text-white">T3 (72/1000)</div></div>
                    <div class="text-right font-mono text-cyan">${Math.round(budget * 0.072)} €/an</div>
                </div>
                <div class="flex justify-between items-center">
                    <div><div class="text-sm font-bold text-white">T4 (95/1000)</div></div>
                    <div class="text-right font-mono text-cyan">${Math.round(budget * 0.095)} €/an</div>
                </div>
            `;

            // Contracts
            document.getElementById('contract-details').innerHTML = `
                <div class="bg-abysse/50 p-4 rounded-xl border border-white/10">
                    <div class="font-bold text-white mb-1">Fournisseur : ${site.provider}</div>
                    <div class="text-xs text-gray-500">Contrat ${site.energy.toUpperCase()} • Tarif Marché</div>
                </div>
            `;

            // Chart
            if(chartInstance) chartInstance.destroy();
            const ctx = document.getElementById('chartBudget').getContext('2d');
            const monthly = [15,14,12,8,5,4,3,3,5,9,10,12].map(p => budget * p / 100);
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['J','F','M','A','M','J','J','A','S','O','N','D'],
                    datasets: [{ label: 'Budget (€)', data: monthly, backgroundColor: '#6366F1', borderRadius: 4 }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
