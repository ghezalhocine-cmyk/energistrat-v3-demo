<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENERGISTRAT OPS | DATA CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e5e5e5; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .bento-card { background: #0a0a0a; border: 1px solid #333; border-radius: 0.5rem; overflow: hidden; position: relative; }
        .terminal-text { color: #00ff41; }
        .terminal-error { color: #ff3333; }
        .terminal-warn { color: #ffcc00; }
        .drop-zone { border: 2px dashed #333; transition: all 0.3s ease; }
        .drop-zone.active { border-color: #00E5FF; background: rgba(0, 229, 255, 0.05); }
        .scanline {
            width: 100%; height: 100px; z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(0, 229, 255, 0.1) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1; position: absolute; pointer-events: none; animation: scanline 10s linear infinite;
        }
        @keyframes scanline { 0% { top: -100%; } 100% { top: 100%; } }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <header class="h-16 border-b border-gray-800 flex items-center justify-between px-6 bg-black z-20">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
            <h1 class="font-mono text-lg font-bold tracking-widest text-white">OPS_CENTER <span class="text-gray-600">//</span> INGEST_NODE_V3</h1>
        </div>
        <div class="flex gap-4 text-xs font-mono text-gray-400">
            <span>CORE: ONLINE</span>
        </div>
    </header>

    <main class="flex-1 p-6 grid grid-cols-12 gap-6 relative">
        <div class="scanline"></div>
        <div class="col-span-8 flex flex-col gap-6">
            <div class="grid grid-cols-3 gap-4">
                <div class="bento-card p-4">
                    <p class="text-xs text-gray-500 font-mono">API SGE</p>
                    <p class="text-xl font-bold text-white mt-1">{{ api_status.sge_enedis.status }}</p>
                </div>
                <div class="bento-card p-4">
                    <p class="text-xs text-gray-500 font-mono">API ADAM</p>
                    <p class="text-xl font-bold text-white mt-1">{{ api_status.adam_grdf.status }}</p>
                </div>
                <div class="bento-card p-4">
                    <p class="text-xs text-gray-500 font-mono">QUEUE</p>
                    <p class="text-xl font-bold text-cyan-400 mt-1" id="queue-count">0</p>
                </div>
            </div>
            <div class="bento-card flex-1 flex flex-col justify-center items-center drop-zone relative cursor-pointer group" id="drop-area">
                <input type="file" id="fileElem" multiple accept=".csv, .xlsx" class="hidden">
                <i data-lucide="upload-cloud" class="w-24 h-24 text-gray-700 group-hover:text-cyan-400 transition-colors mb-6"></i>
                <h2 class="text-2xl font-bold text-white">DRAG & DROP SGE FILES</h2>
                <p class="text-gray-500 font-mono text-sm mt-2">Auto-Detect: Identifiant PRM in CSV/XLSX</p>
                <button class="mt-8 px-6 py-2 bg-cyan-900/30 border border-cyan-500/50 text-cyan-400 font-mono text-sm" onclick="document.getElementById('fileElem').click()">BROWSE</button>
            </div>
        </div>
        <div class="col-span-4 bento-card flex flex-col">
            <div class="h-10 border-b border-gray-800 bg-gray-900/50 flex items-center px-4">
                <span class="text-xs font-mono text-gray-400">TERMINAL OUTPUT</span>
            </div>
            <div class="flex-1 bg-black p-4 font-mono text-xs overflow-y-auto" id="console-output">
                <div class="text-gray-500">system ready...</div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const dropArea = document.getElementById('drop-area');
        const consoleOutput = document.getElementById('console-output');
        const queueCount = document.getElementById('queue-count');

        function log(msg, type = 'info') {
            const line = document.createElement('div');
            line.className = 'mb-1 break-all ' + (type === 'success' ? 'terminal-text' : type === 'error' ? 'terminal-error' : 'text-gray-300');
            line.innerHTML = `> ${msg}`;
            consoleOutput.appendChild(line);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });
        ['dragenter', 'dragover'].forEach(e => dropArea.addEventListener(e, () => dropArea.classList.add('active')));
        ['dragleave', 'drop'].forEach(e => dropArea.addEventListener(e, () => dropArea.classList.remove('active')));

        dropArea.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
        document.getElementById('fileElem').addEventListener('change', function() { handleFiles(this.files) });

        function handleFiles(files) {
            const fileList = [...files];
            queueCount.innerText = fileList.length;
            log(`Batch: ${fileList.length} files. Starting upload...`, 'warn');
            uploadFiles(fileList);
        }

        async function uploadFiles(files) {
            const formData = new FormData();
            files.forEach(file => formData.append('files', file));

            try {
                const response = await fetch('/api/ingest/upload', { method: 'POST', body: formData });
                if (response.ok) {
                    const result = await response.json();
                    result.report.forEach(rep => {
                        if (rep.status === 'INGESTED') log(`[OK] ${rep.filename} -> ${rep.message}`, 'success');
                        else log(`[ERR] ${rep.filename} -> ${rep.message}`, 'error');
                    });
                    queueCount.innerText = '0';
                    log('Batch complete.', 'info');
                } else log('Server Error.', 'error');
            } catch (err) { log(`Network Error: ${err.message}`, 'error'); }
        }
    </script>
</body>
</html>
