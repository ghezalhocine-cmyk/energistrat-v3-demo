<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT | Performance Industrielle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { abysse: '#050505', card: '#0F172A', cyan: '#00E5FF', alert: '#F59E0B', success: '#10B981' }, fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } } }
    </script>
    <style>body { background-color: #050505; color: white; } .bento-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); }</style>
</head>
<body class="flex h-screen w-screen overflow-hidden text-sm font-sans">
    <aside class="w-16 bg-[#020617] border-r border-white/10 flex flex-col items-center py-6 z-50">
        <a href="/dashboard/industry" class="mb-8 text-gray-500 hover:text-white transition"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <div class="w-10 h-10 rounded bg-success/20 text-success flex items-center justify-center mb-4"><i class="fa-solid fa-chart-area"></i></div>
    </aside>

    <main class="flex-1 flex flex-col p-8 overflow-y-auto bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-black text-white">Performance ISO 50001</h1>
                <p class="text-gray-400 text-xs mt-1">Méthode CUSUM (Données Réelles)</p>
            </div>
        </header>

        <div class="space-y-8">
            <div class="bento-card p-8 rounded-2xl">
                <div class="flex justify-between mb-6">
                    <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-scale-unbalanced text-success mr-2"></i> CUSUM (Cumul des Économies)</h2>
                </div>
                <div class="h-72 w-full"><canvas id="cusumChart"></canvas></div>
                <p class="text-xs text-gray-500 mt-4 italic text-center">Courbe générée par Cortex Physics sur la base de vos factures.</p>
            </div>
        </div>
    </main>

    <script>
        async function init() {
            try {
                const res = await fetch('/api/physics/industry/global');
                const data = await res.json();
                
                if (data.cusum) {
                    const c = data.cusum;
                    const ctxCusum = document.getElementById('cusumChart').getContext('2d');
                    new Chart(ctxCusum, {
                        type: 'line',
                        data: {
                            labels: c.labels,
                            datasets: [{
                                label: 'Cumul Écarts (kWh)',
                                data: c.values,
                                borderColor: '#10B981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false }
                    });
                }
            } catch(e) { console.error(e); }
        }
        init();
    </script>
</body>
</html>
