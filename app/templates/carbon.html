<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT | Bilan Carbone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { abysse: '#050505', card: '#0F172A', cyan: '#00E5FF', co2: '#64748B', tree: '#22C55E' }, fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } } }
    </script>
    <style>body { background-color: #050505; color: white; } .bento-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); }</style>
</head>
<body class="flex h-screen w-screen overflow-hidden text-sm font-sans">
    <aside class="w-16 bg-[#020617] border-r border-white/10 flex flex-col items-center py-6 z-50">
        <a href="/dashboard/industry" class="mb-8 text-gray-500 hover:text-white transition"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <div class="w-10 h-10 rounded bg-tree/20 text-tree flex items-center justify-center mb-4"><i class="fa-solid fa-leaf"></i></div>
    </aside>

    <main class="flex-1 flex flex-col p-8 overflow-y-auto bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-black text-white">Bilan Carbone (Scope 2)</h1>
                <p class="text-gray-400 text-xs mt-1">Conformité CSRD • Base ADEME</p>
            </div>
            <button onclick="window.print()" class="bg-white text-black px-4 py-2 rounded font-bold text-xs hover:bg-gray-200 transition"><i class="fa-solid fa-download mr-2"></i>Export PDF</button>
        </header>

        <div class="grid grid-cols-3 gap-8">
            <!-- TOTAL -->
            <div class="col-span-1 bento-card p-8 rounded-2xl flex flex-col justify-center items-center text-center border-t-4 border-co2">
                <div class="text-xs text-gray-500 uppercase font-bold mb-4">Emissions Totales (YTD)</div>
                <div class="text-6xl font-black text-white mb-2">428</div>
                <div class="text-xl font-bold text-gray-400">Tonnes CO2eq</div>
                <div class="mt-6 text-xs text-tree bg-tree/10 px-3 py-1 rounded-full border border-tree/20">-5% vs N-1</div>
            </div>

            <!-- MIX -->
            <div class="col-span-1 bento-card p-8 rounded-2xl">
                <h3 class="text-sm font-bold text-white mb-4 text-center">Origine des Émissions</h3>
                <div class="h-48 relative"><canvas id="co2Chart"></canvas></div>
            </div>

            <!-- EQUIVALENCE -->
            <div class="col-span-1 bento-card p-8 rounded-2xl bg-gradient-to-br from-card to-tree/10 border-tree/20">
                <h3 class="text-sm font-bold text-white mb-4">Compensation Équivalente</h3>
                <div class="flex flex-col items-center justify-center h-full pb-8">
                    <i class="fa-solid fa-tree text-6xl text-tree mb-4"></i>
                    <div class="text-4xl font-bold text-white">17 120</div>
                    <div class="text-xs text-gray-400">Arbres nécessaires</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const ctx = document.getElementById('co2Chart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Électricité (Mix FR)', 'Gaz Naturel', 'Fioul'],
                datasets: [{
                    data: [15, 75, 10], // L'élec pèse peu en France, le Gaz pèse lourd
                    backgroundColor: ['#00E5FF', '#F59E0B', '#64748B'],
                    borderWidth: 0
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: 'white', font: { size: 10 } } } } }
        });
    </script>
</body>
</html>
