<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT V21.0 | Settings Multi-Fluides</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        abysse: '#050505',
                        card: '#0F172A',
                        cyan: '#00E5FF',
                        purple: '#A855F7',
                        success: '#10B981',
                        orange: '#F97316',
                        yellow: '#EAB308',
                        gas: '#EF4444' // Rouge pour le Gaz
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    borderRadius: { 'bento': '1.5rem' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: white; }
        .bento-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .nav-item.active { background: rgba(0, 229, 255, 0.1); border-left: 3px solid #00E5FF; color: white; }
        .input-dark { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; transition: all 0.3s; }
        .input-dark:focus { border-color: #00E5FF; outline: none; box-shadow: 0 0 15px rgba(0, 229, 255, 0.1); }
        .suggestions-list { position: absolute; background: #0F172A; border: 1px solid #334155; width: 100%; z-index: 50; max-height: 200px; overflow-y: auto; border-radius: 0 0 8px 8px; }
        .suggestion-item { padding: 8px 12px; cursor: pointer; font-size: 0.75rem; }
        .suggestion-item:hover { background: #00E5FF; color: black; }
        
        /* Badges & Toast */
        .badge-elec { color: #00E5FF; border: 1px solid #00E5FF; background: rgba(0, 229, 255, 0.1); }
        .badge-gaz { color: #EF4444; border: 1px solid #EF4444; background: rgba(239, 68, 68, 0.1); }
        #toast { visibility: hidden; min-width: 250px; background-color: #10B981; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 100; right: 30px; bottom: 30px; font-size: 14px; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); transform: translateY(100px); transition: all 0.5s; }
        #toast.show { visibility: visible; transform: translateY(0); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    </style>
</head>
<body class="flex h-screen w-screen overflow-hidden text-sm">

    <!-- TOAST -->
    <div id="toast"><i class="fa-solid fa-check-circle mr-2"></i>Site enregistré avec succès !</div>

    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#020617] border-r border-white/5 flex flex-col z-50">
        <div class="p-6 flex items-center gap-3 mb-4">
            <button onclick="history.back()" class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h1 class="font-bold text-lg">Paramètres</h1>
        </div>
        <nav class="flex-1 px-4 space-y-1">
            <button onclick="switchTab('clients')" id="nav-clients" class="nav-item active w-full text-left px-4 py-3 text-gray-400 font-medium rounded-r-lg hover:bg-white/5 transition flex items-center gap-3 border-l-4 border-transparent">
                <i class="fa-solid fa-sitemap w-5 text-center text-cyan"></i> Structure & Parc
            </button>
            <button onclick="switchTab('general')" id="nav-general" class="nav-item w-full text-left px-4 py-3 text-gray-400 font-medium rounded-r-lg hover:bg-white/5 transition flex items-center gap-3 border-l-4 border-transparent">
                <i class="fa-solid fa-user w-5 text-center"></i> Profil Admin
            </button>
            <button onclick="switchTab('security')" id="nav-security" class="nav-item w-full text-left px-4 py-3 text-gray-400 font-medium rounded-r-lg hover:bg-white/5 transition flex items-center gap-3 border-l-4 border-transparent">
                <i class="fa-solid fa-shield-halved w-5 text-center"></i> Sécurité & 2FA
            </button>
            <button onclick="switchTab('billing')" id="nav-billing" class="nav-item w-full text-left px-4 py-3 text-gray-400 font-medium rounded-r-lg hover:bg-white/5 transition flex items-center gap-3 border-l-4 border-transparent">
                <i class="fa-solid fa-credit-card w-5 text-center"></i> Abonnement
            </button>
            <button onclick="switchTab('api')" id="nav-api" class="nav-item w-full text-left px-4 py-3 text-gray-400 font-medium rounded-r-lg hover:bg-white/5 transition flex items-center gap-3 border-l-4 border-transparent">
                <i class="fa-solid fa-code w-5 text-center"></i> API & Clés
            </button>
        </nav>
        <div class="p-6"><a href="/" class="flex items-center gap-2 text-red-400 hover:text-red-300 text-xs font-bold transition"><i class="fa-solid fa-power-off"></i> Déconnexion</a></div>
    </aside>

    <!-- CONTENT -->
    <main class="flex-1 overflow-y-auto p-10 relative bg-abysse">
        
        <!-- TAB 1: CLIENTS & PARC -->
        <div id="tab-clients" class="tab-content max-w-6xl mx-auto space-y-6">
            <header class="flex justify-between items-end">
                <div><h2 class="text-2xl font-bold text-white mb-1">Architecture & Parc</h2><p class="text-gray-400 text-xs">Gestion Multi-Sites, Gaz/Élec et Lots.</p></div>
                <div class="flex gap-2">
                    <button onclick="toggleImportModal()" class="bg-white/5 hover:bg-white/10 text-white px-4 py-2 rounded-lg text-xs font-bold border border-white/10 transition"><i class="fa-solid fa-file-csv mr-2"></i>Import Masse</button>
                    <button onclick="saveSite()" class="bg-cyan text-black px-4 py-2 rounded-lg text-xs font-bold hover:bg-cyan/90 transition shadow-lg shadow-cyan/20"><i class="fa-solid fa-plus mr-2"></i>Enregistrer le Site</button>
                </div>
            </header>

            <!-- 1. IDENTITÉ -->
            <div class="bento-card rounded-bento p-6 border-l-4 border-cyan">
                <h3 class="text-sm font-bold text-white mb-4 flex items-center gap-2"><span class="w-6 h-6 rounded bg-cyan/20 text-cyan flex items-center justify-center text-[10px]">1</span> ENTITÉ JURIDIQUE</h3>
                <div class="flex gap-4 mb-4">
                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="entity_type" value="company" checked class="accent-cyan" onchange="updateFormType()"><span class="text-xs text-white">Entreprise / Public</span></label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="entity_type" value="copro" class="accent-orange" onchange="updateFormType()"><span class="text-xs text-white">Copropriété (RNC)</span></label>
                </div>
                <div class="grid grid-cols-12 gap-4">
                    <div class="col-span-3"><label id="lbl-id" class="text-[10px] text-gray-500 font-bold uppercase">SIRET *</label><div class="relative"><input type="text" id="id-input" placeholder="123..." class="w-full input-dark p-2 rounded text-xs font-mono" onblur="checkIdentity()"><div id="id-status" class="absolute right-2 top-2 text-[10px]"></div></div></div>
                    <div class="col-span-5"><label class="text-[10px] text-gray-500 font-bold uppercase">Raison Sociale</label><input type="text" id="company-name" placeholder="Auto..." class="w-full input-dark p-2 rounded text-xs bg-white/5"></div>
                    <div class="col-span-4"><label class="text-[10px] text-gray-500 font-bold uppercase">Groupe / Réseau</label><select class="w-full input-dark p-2 rounded text-xs"><option value="none">Aucun</option><option value="sde">Syndicat Énergie</option><option value="retail">Réseau Retail</option></select></div>
                </div>
            </div>

            <!-- 2. TECHNIQUE & ADRESSE -->
            <div class="bento-card rounded-bento p-6 border-l-4 border-purple-500">
                <h3 class="text-sm font-bold text-white mb-4 flex items-center gap-2"><span class="w-6 h-6 rounded bg-purple-500/20 text-purple-400 flex items-center justify-center text-[10px]">2</span> LOCALISATION</h3>
                <div class="grid grid-cols-12 gap-4">
                    <div class="col-span-3"><label class="text-[10px] text-gray-500 font-bold uppercase">Usage</label><select class="w-full input-dark p-2 rounded text-xs"><option value="batiment">Bâtiment</option><option value="ep">Éclairage Public</option><option value="process">Industrie</option></select></div>
                    <div class="col-span-6 relative"><label class="text-[10px] text-gray-500 font-bold uppercase">Adresse (BAN)</label><input type="text" id="address-input" class="w-full input-dark p-2 rounded text-xs" oninput="searchAddress()"><div id="address-suggestions" class="suggestions-list hidden"></div></div>
                    <div class="col-span-3"><label class="text-[10px] text-gray-500 font-bold uppercase">Surface (m²)</label><input type="number" class="w-full input-dark p-2 rounded text-xs"></div>
                </div>
            </div>

            <!-- 3. ÉNERGIE & CONTRAT (MULTI-FLUIDES) -->
            <div class="bento-card rounded-bento p-6 border-l-4 border-yellow-500 transition-colors" id="card-energy">
                <h3 class="text-sm font-bold text-white mb-4 flex items-center justify-between">
                    <div class="flex items-center gap-2"><span class="w-6 h-6 rounded bg-yellow-500/20 text-yellow-400 flex items-center justify-center text-[10px]">3</span> CONTRAT & FLUIDE</div>
                    <!-- SELECTEUR FLUIDE -->
                    <div class="flex bg-black/40 rounded-lg p-1">
                        <button onclick="setEnergy('elec')" id="btn-elec" class="px-3 py-1 text-[10px] font-bold rounded bg-cyan text-black transition">ÉLEC</button>
                        <button onclick="setEnergy('gaz')" id="btn-gaz" class="px-3 py-1 text-[10px] font-bold rounded text-gray-400 hover:text-white transition">GAZ</button>
                    </div>
                </h3>
                
                <div class="grid grid-cols-12 gap-4">
                    
                    <!-- CHAMPS DYNAMIQUES -->
                    <div class="col-span-3">
                        <label id="lbl-ref" class="text-[10px] text-gray-500 font-bold uppercase">PDL / PRM (14)</label>
                        <input type="text" id="ref-input" placeholder="000..." class="w-full input-dark p-2 rounded text-xs font-mono">
                    </div>
                    
                    <div class="col-span-2">
                        <label id="lbl-puiss" class="text-[10px] text-gray-500 font-bold uppercase">Puissance (kVA)</label>
                        <input type="number" id="val-input" placeholder="Ex: 36" class="w-full input-dark p-2 rounded text-xs font-mono text-yellow-500 font-bold" oninput="inferContract()">
                    </div>
                    
                    <div class="col-span-2">
                        <label class="text-[10px] text-gray-500 font-bold uppercase">Segment / Tarif</label>
                        <input type="text" id="segment-display" readonly class="w-full input-dark p-2 rounded text-xs font-bold text-gray-400 bg-white/5" value="--">
                    </div>

                    <!-- FOURNISSEUR & LOT -->
                    <div class="col-span-3">
                        <label class="text-[10px] text-gray-500 font-bold uppercase">Fournisseur (France)</label>
                        <select class="w-full input-dark p-2 rounded text-xs">
                            <optgroup label="Historiques">
                                <option>EDF</option>
                                <option>Engie</option>
                                <option>TotalEnergies</option>
                                <option>Eni</option>
                            </optgroup>
                            <optgroup label="Alternatifs / ELD">
                                <option>Vattenfall</option>
                                <option>Iberdrola</option>
                                <option>Alterna</option>
                                <option>Sowee</option>
                                <option>Mint Energie</option>
                                <option>Enercoop</option>
                                <option>GEG (Grenoble)</option>
                                <option>ES Strasbourg</option>
                                <option>UEM (Metz)</option>
                            </optgroup>
                        </select>
                    </div>
                    
                    <div class="col-span-2">
                        <label class="text-[10px] text-gray-500 font-bold uppercase">Fin Contrat</label>
                        <input type="date" class="w-full input-dark p-2 rounded text-xs text-gray-400">
                    </div>
                </div>
            </div>
        </div>

        <!-- TABS CLASSIQUES (RESTORED) -->
        <div id="tab-general" class="tab-content max-w-3xl mx-auto space-y-8 hidden"><div class="bento-card rounded-bento p-8"><h2 class="text-2xl font-bold text-white">Profil</h2></div></div>
        <div id="tab-security" class="tab-content max-w-3xl mx-auto space-y-8 hidden"><div class="bento-card rounded-bento p-8"><h2 class="text-2xl font-bold text-white">Sécurité</h2></div></div>
        <div id="tab-billing" class="tab-content max-w-3xl mx-auto space-y-8 hidden"><div class="bento-card rounded-bento p-8"><h2 class="text-2xl font-bold text-white">Facturation</h2></div></div>
        <div id="tab-api" class="tab-content max-w-3xl mx-auto space-y-8 hidden"><div class="bento-card rounded-bento p-8"><h2 class="text-2xl font-bold text-white">API</h2></div></div>

    </main>

    <!-- IMPORT MODAL -->
    <div id="import-modal" class="fixed inset-0 bg-black/90 z-[99] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="bento-card p-8 rounded-bento w-[600px] relative">
            <button onclick="toggleImportModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-xl font-bold text-white mb-2"><i class="fa-solid fa-table-columns text-cyan mr-2"></i>Import de Parc (V3)</h3>
            <p class="text-xs text-gray-400 mb-6">Supporte Élec (PDL) et Gaz (PCE).</p>
            <div class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center hover:border-cyan hover:bg-cyan/5 transition cursor-pointer mb-4">
                <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-500 mb-2"></i>
                <div class="text-sm font-bold text-white">Glisser fichier CSV</div>
            </div>
            <button class="w-full bg-cyan text-black font-bold py-3 rounded-lg mt-6">LANCER</button>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.nav-item').forEach(el => { el.classList.remove('active', 'text-white', 'border-cyan'); el.classList.add('text-gray-400', 'border-transparent'); });
            const btn = document.getElementById('nav-' + tabId); if(btn) { btn.classList.add('active', 'text-white', 'border-cyan'); btn.classList.remove('text-gray-400', 'border-transparent'); }
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden')); document.getElementById('tab-' + tabId).classList.remove('hidden');
        }
        function toggleImportModal() { document.getElementById('import-modal').classList.toggle('hidden'); }

        // --- ENERGY SWITCHER ---
        let currentEnergy = 'elec';

        function setEnergy(type) {
            currentEnergy = type;
            const btnElec = document.getElementById('btn-elec');
            const btnGaz = document.getElementById('btn-gaz');
            const lblRef = document.getElementById('lbl-ref');
            const lblPuiss = document.getElementById('lbl-puiss');
            const card = document.getElementById('card-energy');

            if(type === 'elec') {
                btnElec.className = "px-3 py-1 text-[10px] font-bold rounded bg-cyan text-black transition shadow-[0_0_10px_rgba(0,229,255,0.5)]";
                btnGaz.className = "px-3 py-1 text-[10px] font-bold rounded text-gray-400 hover:text-white transition";
                lblRef.innerText = "PDL / PRM (14)";
                lblPuiss.innerText = "Puissance (kVA)";
                card.style.borderColor = "#00E5FF"; // Cyan Border
            } else {
                btnGaz.className = "px-3 py-1 text-[10px] font-bold rounded bg-gas text-white transition shadow-[0_0_10px_rgba(239,68,68,0.5)]";
                btnElec.className = "px-3 py-1 text-[10px] font-bold rounded text-gray-400 hover:text-white transition";
                lblRef.innerText = "PCE (14)";
                lblPuiss.innerText = "CAR (MWh/an)";
                card.style.borderColor = "#EF4444"; // Red Border
            }
            // Reset values
            document.getElementById('val-input').value = '';
            document.getElementById('segment-display').value = '--';
        }

        // --- SMART INFERENCE (ELEC & GAZ) ---
        function inferContract() {
            const val = parseFloat(document.getElementById('val-input').value);
            const disp = document.getElementById('segment-display');
            
            if(isNaN(val)) { disp.value = '--'; return; }

            if(currentEnergy === 'elec') {
                // Logic Elec (kVA)
                if (val <= 36) disp.value = "C5 (Bleu)";
                else if (val <= 250) disp.value = "C4 (Jaune)";
                else disp.value = "HTA (Vert)";
            } else {
                // Logic Gaz (MWh) - Simplifiée
                if (val < 6) disp.value = "T1 (Base/B0)";
                else if (val < 300) disp.value = "T2 (B1)";
                else if (val < 5000) disp.value = "T3 (B2i)";
                else disp.value = "T4 (Grand Transport)";
            }
        }

        // --- SAVE SYSTEM ---
        function saveSite() {
            const btn = document.querySelector('button[onclick="saveSite()"]');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>En cours...';
            setTimeout(() => {
                document.getElementById('toast').className = "show";
                setTimeout(() => document.getElementById('toast').className = "", 3000);
                btn.innerHTML = original;
                // Reset minimal
                document.getElementById('company-name').value = '';
                document.getElementById('id-input').value = '';
            }, 800);
        }

        // --- IDENTITY & ADDRESS (UNCHANGED) ---
        function updateFormType() {
            const type = document.querySelector('input[name="entity_type"]:checked').value;
            if(type === 'company') { document.getElementById('lbl-id').innerText = "SIRET"; document.getElementById('id-input').placeholder = "123..."; } 
            else { document.getElementById('lbl-id').innerText = "RNC"; document.getElementById('id-input').placeholder = "AA123..."; }
        }
        async function checkIdentity() { /* (Même logique API Gouv que V20) */ 
            const val = document.getElementById('id-input').value; 
            if(val.length > 5) document.getElementById('id-status').innerHTML = '<i class="fa-solid fa-check text-green-500"></i>'; 
        }
        
        let timeout = null;
        async function searchAddress() {
            const query = document.getElementById('address-input').value;
            const list = document.getElementById('address-suggestions');
            if(query.length < 4) { list.classList.add('hidden'); return; }
            clearTimeout(timeout);
            timeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(query)}&limit=5`);
                    const data = await res.json();
                    list.innerHTML = '';
                    if(data.features) {
                        list.classList.remove('hidden');
                        data.features.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item text-gray-300';
                            div.innerText = item.properties.label;
                            div.onclick = () => { document.getElementById('address-input').value = item.properties.label; list.classList.add('hidden'); };
                            list.appendChild(div);
                        });
                    }
                } catch(e) {}
            }, 300);
        }
        document.addEventListener('click', function(e) { if (!document.getElementById('address-input').contains(e.target)) document.getElementById('address-suggestions').classList.add('hidden'); });

        switchTab('clients');
    </script>
</body>
</html>
