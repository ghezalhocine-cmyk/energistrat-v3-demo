<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT | Market Commander V19.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { abysse: '#050505', card: '#0F172A', cyan: '#00E5FF', gas: '#EF4444', success: '#10B981', purple: '#A855F7' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: white; }
        .input-market { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; text-align: center; transition: 0.3s; width: 100%; padding: 8px; border-radius: 8px; }
        .input-market:focus { border-color: white; outline: none; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .label-market { font-size: 0.65rem; color: #94a3b8; font-weight: 800; text-transform: uppercase; margin-bottom: 0.25rem; display: block; }
        .section-title { font-size: 0.8rem; font-weight: bold; color: white; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#1e293b] via-[#050505] to-[#050505]">

    <div class="max-w-6xl w-full">
        
        <!-- HEADER -->
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-3xl font-black tracking-tighter">MARKET<span class="text-cyan">.WATCH</span></h1>
                <p class="text-gray-400 text-xs mt-1">Pilotage des Indices de Référence (Triple Sentinelle)</p>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-gray-500 uppercase font-bold">Dernière MàJ</div>
                <div class="text-sm font-mono text-white" id="last-update">--</div>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-6">
            
            <!-- 1. BOURSE (EEX) -->
            <div class="bg-[#0F172A] border border-cyan/30 rounded-2xl p-6 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-4xl text-cyan"><i class="fa-solid fa-chart-line"></i></div>
                <h2 class="text-lg font-bold text-cyan mb-4 flex items-center gap-2"><i class="fa-solid fa-bolt"></i> BOURSE (EEX)</h2>
                
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <div><label class="label-market">CAL N+1</label><input type="number" id="elec-n1" class="input-market text-white"></div>
                    <div><label class="label-market">CAL N+2</label><input type="number" id="elec-n2" class="input-market text-gray-300"></div>
                    <div><label class="label-market">CAL N+3</label><input type="number" id="elec-n3" class="input-market text-gray-500 border-dashed"></div>
                </div>
                
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <div><label class="label-market">PEG N+1</label><input type="number" id="gaz-n1" class="input-market text-gas border-gas/30"></div>
                    <div><label class="label-market">PEG N+2</label><input type="number" id="gaz-n2" class="input-market text-gas/70 border-gas/30"></div>
                    <div><label class="label-market">PEG N+3</label><input type="number" id="gaz-n3" class="input-market text-gas/50 border-gas/30 border-dashed"></div>
                </div>

                <div>
                    <label class="label-market">Tendance Globale</label>
                    <select id="market-trend" class="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-sm text-center focus:border-cyan outline-none text-white font-bold">
                        <option value="BAISSIER">📉 BAISSIER (Opportunité)</option>
                        <option value="STABLE">➡️ STABLE</option>
                        <option value="HAUSSIER">📈 HAUSSIER (Urgence)</option>
                    </select>
                </div>
            </div>

            <!-- 2. TRVE (Plafond) -->
            <div class="bg-[#0F172A] border border-blue-500/30 rounded-2xl p-6 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-4xl text-blue-500"><i class="fa-solid fa-landmark"></i></div>
                <h2 class="text-lg font-bold text-blue-400 mb-4 flex items-center gap-2"><i class="fa-solid fa-shield-halved"></i> TRVE (Public)</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="label-market">ÉLEC - C5 (Bleu Pro) €/MWh</label>
                        <input type="number" id="trve-elec-c5" class="input-market text-blue-200" placeholder="230.0">
                    </div>
                    <div>
                        <label class="label-market">ÉLEC - C4 (Jaune) €/MWh</label>
                        <input type="number" id="trve-elec-c4" class="input-market text-blue-200" placeholder="180.0">
                    </div>
                    <div>
                        <label class="label-market">GAZ - T1/T2 (Prix Repère) €/MWh</label>
                        <input type="number" id="trve-gaz" class="input-market text-blue-200" placeholder="110.0">
                    </div>
                </div>
            </div>

            <!-- 3. CIBLE COURTAGE (Plancher) -->
            <div class="bg-[#0F172A] border border-purple-500/30 rounded-2xl p-6 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-4xl text-purple-500"><i class="fa-solid fa-bullseye"></i></div>
                <h2 class="text-lg font-bold text-purple-400 mb-4 flex items-center gap-2"><i class="fa-solid fa-handshake"></i> CIBLES (Broker)</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="label-market">CIBLE C5 (Petits Sites)</label>
                        <input type="number" id="target-c5" class="input-market text-purple-200 font-bold" placeholder="190.0">
                    </div>
                    <div>
                        <label class="label-market">CIBLE C4 (PME/Industrie)</label>
                        <input type="number" id="target-c4" class="input-market text-purple-200 font-bold" placeholder="140.0">
                    </div>
                    <div>
                        <label class="label-market">CIBLE GAZ (Toutes tailles)</label>
                        <input type="number" id="target-gaz" class="input-market text-purple-200 font-bold" placeholder="85.0">
                    </div>
                </div>
            </div>

        </div>

        <!-- ACTIONS -->
        <div class="mt-8 flex justify-end gap-4">
            <a href="/ops" class="px-6 py-4 rounded-xl font-bold text-gray-400 hover:text-white transition">Retour Ops</a>
            <button onclick="saveMarket()" class="bg-white text-black px-8 py-4 rounded-xl font-bold hover:bg-gray-200 transition shadow-[0_0_20px_rgba(255,255,255,0.3)] flex items-center gap-2">
                <i class="fa-solid fa-satellite-dish"></i> DIFFUSER LES RÉFÉRENCES
            </button>
        </div>

    </div>

    <script>
        const ADMIN_TOKEN = "BOSS_V5";

        async function loadMarket() {
            try {
                const res = await fetch('/api/market/current');
                const data = await res.json();
                
                // BOURSE
                if(data.elec) {
                    document.getElementById('elec-n1').value = data.elec.cal_n1 || '';
                    document.getElementById('elec-n2').value = data.elec.cal_n2 || '';
                    document.getElementById('elec-n3').value = data.elec.cal_n3 || ''; 
                    document.getElementById('market-trend').value = data.elec.trend || "STABLE";
                }
                if(data.gaz) {
                    document.getElementById('gaz-n1').value = data.gaz.peg_n1 || '';
                    document.getElementById('gaz-n2').value = data.gaz.peg_n2 || '';
                    document.getElementById('gaz-n3').value = data.gaz.peg_n3 || '';
                }

                // TRVE (Nouveaux champs)
                if(data.trve) {
                    document.getElementById('trve-elec-c5').value = data.trve.elec_c5 || '';
                    document.getElementById('trve-elec-c4').value = data.trve.elec_c4 || '';
                    document.getElementById('trve-gaz').value = data.trve.gaz || '';
                }

                // TARGETS (Nouveaux champs)
                if(data.targets) {
                    document.getElementById('target-c5').value = data.targets.c5 || '';
                    document.getElementById('target-c4').value = data.targets.c4 || '';
                    document.getElementById('target-gaz').value = data.targets.gaz || '';
                }

                if(data.updated_at) {
                    document.getElementById('last-update').innerText = new Date(data.updated_at).toLocaleString();
                }
            } catch(e) { console.error("Erreur chargement", e); }
        }

        async function saveMarket() {
            const btn = document.querySelector('button');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PUBLICATION...';

            const payload = {
                elec: {
                    cal_n1: parseFloat(document.getElementById('elec-n1').value) || 0,
                    cal_n2: parseFloat(document.getElementById('elec-n2').value) || 0,
                    cal_n3: parseFloat(document.getElementById('elec-n3').value) || 0,
                    trend: document.getElementById('market-trend').value
                },
                gaz: {
                    peg_n1: parseFloat(document.getElementById('gaz-n1').value) || 0,
                    peg_n2: parseFloat(document.getElementById('gaz-n2').value) || 0,
                    peg_n3: parseFloat(document.getElementById('gaz-n3').value) || 0,
                    trend: document.getElementById('market-trend').value
                },
                trve: {
                    elec_c5: parseFloat(document.getElementById('trve-elec-c5').value) || 0,
                    elec_c4: parseFloat(document.getElementById('trve-elec-c4').value) || 0,
                    gaz: parseFloat(document.getElementById('trve-gaz').value) || 0
                },
                targets: {
                    c5: parseFloat(document.getElementById('target-c5').value) || 0,
                    c4: parseFloat(document.getElementById('target-c4').value) || 0,
                    gaz: parseFloat(document.getElementById('target-gaz').value) || 0
                }
            };

            try {
                const res = await fetch('/api/ops/market/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-token': ADMIN_TOKEN
                    },
                    body: JSON.stringify(payload)
                });
                
                if(res.ok) {
                    alert("✅ Référentiels mis à jour (Bourse + TRVE + Cibles).");
                    loadMarket(); 
                } else {
                    alert("❌ Erreur serveur.");
                }
            } catch(e) { alert("❌ Erreur réseau"); }
            
            btn.innerHTML = original;
        }

        document.addEventListener('DOMContentLoaded', loadMarket);
    </script>
</body>
</html>
