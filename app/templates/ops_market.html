<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT | Market Commander</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { abysse: '#050505', card: '#0F172A', cyan: '#00E5FF', gas: '#EF4444', success: '#10B981' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: white; }
        .input-market { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; text-align: center; transition: 0.3s; }
        .input-market:focus { border-color: white; outline: none; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#1e293b] via-[#050505] to-[#050505]">

    <div class="max-w-4xl w-full">
        
        <!-- HEADER -->
        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-3xl font-black tracking-tighter">MARKET<span class="text-cyan">.WATCH</span></h1>
                <p class="text-gray-400 text-xs mt-1">Mise à jour des indices de référence (Hebdo)</p>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-gray-500 uppercase font-bold">Dernière MàJ</div>
                <div class="text-sm font-mono text-white" id="last-update">--</div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-8">
            
            <!-- BLOC ÉLEC -->
            <div class="bg-[#0F172A] border border-cyan/30 rounded-2xl p-8 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-6xl text-cyan"><i class="fa-solid fa-bolt"></i></div>
                <h2 class="text-xl font-bold text-cyan mb-6 flex items-center gap-2"><i class="fa-solid fa-plug"></i> ÉLECTRICITÉ (EEX)</h2>
                
                <div class="space-y-6">
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold block mb-2">CAL N+1 (€/MWh)</label>
                        <input type="number" id="elec-n1" class="w-full input-market p-3 rounded-xl text-white" placeholder="0.00">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold block mb-2">CAL N+2 (€/MWh)</label>
                        <input type="number" id="elec-n2" class="w-full input-market p-3 rounded-xl text-gray-400" placeholder="0.00">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold block mb-2">Tendance</label>
                        <select id="elec-trend" class="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-sm text-center focus:border-cyan outline-none">
                            <option value="BAISSIER">📉 BAISSIER (Opportunité)</option>
                            <option value="STABLE">➡️ STABLE</option>
                            <option value="HAUSSIER">📈 HAUSSIER (Urgence)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- BLOC GAZ -->
            <div class="bg-[#0F172A] border border-gas/30 rounded-2xl p-8 relative overflow-hidden group">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-6xl text-gas"><i class="fa-solid fa-fire"></i></div>
                <h2 class="text-xl font-bold text-gas mb-6 flex items-center gap-2"><i class="fa-solid fa-fire-flame-curved"></i> GAZ (PEG)</h2>
                
                <div class="space-y-6">
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold block mb-2">PEG N+1 (€/MWh)</label>
                        <input type="number" id="gaz-n1" class="w-full input-market p-3 rounded-xl text-white focus:border-gas" placeholder="0.00">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold block mb-2">PEG N+2 (€/MWh)</label>
                        <input type="number" id="gaz-n2" class="w-full input-market p-3 rounded-xl text-gray-400 focus:border-gas" placeholder="0.00">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 uppercase font-bold block mb-2">Tendance</label>
                        <select id="gaz-trend" class="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-sm text-center focus:border-gas outline-none">
                            <option value="BAISSIER">📉 BAISSIER (Opportunité)</option>
                            <option value="STABLE">➡️ STABLE</option>
                            <option value="HAUSSIER">📈 HAUSSIER (Urgence)</option>
                        </select>
                    </div>
                </div>
            </div>

        </div>

        <!-- ACTIONS -->
        <div class="mt-8 flex justify-end gap-4">
            <a href="/ops" class="px-6 py-4 rounded-xl font-bold text-gray-400 hover:text-white transition">Annuler</a>
            <button onclick="saveMarket()" class="bg-white text-black px-8 py-4 rounded-xl font-bold hover:bg-gray-200 transition shadow-[0_0_20px_rgba(255,255,255,0.3)] flex items-center gap-2">
                <i class="fa-solid fa-satellite-dish"></i> PUBLIER SUR LE RÉSEAU
            </button>
        </div>

    </div>

    <script>
        // TOKEN ADMIN (Hardcodé pour l'interface Ops, à sécuriser via Login dans le futur)
        const ADMIN_TOKEN = "BOSS_V5";

        async function loadMarket() {
            try {
                const res = await fetch('/api/market/current');
                const data = await res.json();
                
                if(data.elec) {
                    document.getElementById('elec-n1').value = data.elec.cal_n1;
                    document.getElementById('elec-n2').value = data.elec.cal_n2;
                    document.getElementById('elec-trend').value = data.elec.trend || "STABLE";
                }
                if(data.gaz) {
                    document.getElementById('gaz-n1').value = data.gaz.peg_n1;
                    document.getElementById('gaz-n2').value = data.gaz.peg_n2;
                    document.getElementById('gaz-trend').value = data.gaz.trend || "STABLE";
                }
                document.getElementById('last-update').innerText = new Date(data.updated_at).toLocaleString();
            } catch(e) { console.error("Erreur chargement", e); }
        }

        async function saveMarket() {
            const btn = document.querySelector('button');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> PUBLICATION...';

            const payload = {
                elec: {
                    cal_n1: parseFloat(document.getElementById('elec-n1').value),
                    cal_n2: parseFloat(document.getElementById('elec-n2').value),
                    trend: document.getElementById('elec-trend').value
                },
                gaz: {
                    peg_n1: parseFloat(document.getElementById('gaz-n1').value),
                    peg_n2: parseFloat(document.getElementById('gaz-n2').value),
                    trend: document.getElementById('gaz-trend').value
                }
            };

            try {
                const res = await fetch('/api/ops/market/update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-token': ADMIN_TOKEN
                    },
                    body: JSON.stringify(payload)
                });
                
                if(res.ok) {
                    alert("Indices mis à jour avec succès ! Tous les dashboards clients utiliseront ces valeurs.");
                    loadMarket(); // Refresh date
                } else {
                    alert("Erreur serveur.");
                }
            } catch(e) { alert("Erreur réseau"); }
            
            btn.innerHTML = original;
        }

        loadMarket();
    </script>
</body>
</html>
