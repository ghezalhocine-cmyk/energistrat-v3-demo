<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MARKET.WATCH | Pilotage Indices</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        abysse: '#050505',
                        card: '#0F172A',
                        cyan: '#00E5FF',
                        gold: '#F59E0B',
                        danger: '#EF4444',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; }
        .bento-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            backdrop-filter: blur(12px);
        }
        .input-market {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            color: #00E5FF;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            border-radius: 0.75rem;
            transition: all 0.3s;
        }
        .input-market:focus {
            border-color: #00E5FF;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            outline: none;
        }
        /* Variations de couleurs pour les inputs */
        .input-gold { color: #F59E0B; }
        .input-gold:focus { border-color: #F59E0B; box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); }
        .input-danger { color: #EF4444; }
        .input-danger:focus { border-color: #EF4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="flex h-screen w-screen overflow-hidden bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">

    <!-- SIDEBAR -->
    <aside class="w-20 bg-abysse border-r border-white/10 flex flex-col items-center py-6 gap-8 z-50">
        <div class="text-cyan text-2xl"><i class="fa-solid fa-chart-simple"></i></div>
        <a href="/" class="text-gray-500 hover:text-white transition"><i class="fa-solid fa-house"></i></a>
        <a href="/dashboard/industry" class="text-gray-500 hover:text-white transition"><i class="fa-solid fa-industry"></i></a>
    </aside>

    <!-- CONTENT -->
    <main class="flex-1 flex flex-col relative">
        
        <!-- HEADER -->
        <div class="h-24 flex items-center justify-between px-10">
            <div>
                <h1 class="text-3xl font-black text-white tracking-wider">MARKET<span class="text-cyan">.WATCH</span></h1>
                <p class="text-gray-500 text-xs font-mono mt-1">Pilotage des Indices de Référence (Triple Sentinelle)</p>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-gray-500 uppercase font-bold tracking-widest">Dernière MàJ</div>
                <div id="last-update" class="text-xl font-mono text-white">--/--/----</div>
            </div>
        </div>

        <!-- GRID -->
        <div class="flex-1 p-10 grid grid-cols-3 gap-8 overflow-y-auto">

            <!-- 1. BOURSE (EEX) -->
            <div class="bento-card p-8 border-t-4 border-cyan">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-lg font-bold text-cyan"><i class="fa-solid fa-bolt mr-2"></i> BOURSE (EEX)</h2>
                    <i class="fa-solid fa-chart-line text-gray-600 text-2xl"></i>
                </div>
                
                <div class="space-y-6">
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div>
                            <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">CAL N+1</label>
                            <input type="number" id="eex-n1" class="input-market w-full py-3" value="85">
                        </div>
                        <div>
                            <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">CAL N+2</label>
                            <input type="number" id="eex-n2" class="input-market w-full py-3" value="75">
                        </div>
                        <div>
                            <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">CAL N+3</label>
                            <input type="number" id="eex-n3" class="input-market w-full py-3" value="65">
                        </div>
                    </div>

                    <div class="h-px bg-white/10"></div>

                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div>
                            <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">PEG N+1</label>
                            <input type="number" id="peg-n1" class="input-market input-danger w-full py-3" value="35">
                        </div>
                        <div>
                            <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">PEG N+2</label>
                            <input type="number" id="peg-n2" class="input-market input-danger w-full py-3" value="32">
                        </div>
                        <div>
                            <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">PEG N+3</label>
                            <input type="number" id="peg-n3" class="input-market input-danger w-full py-3" value="30">
                        </div>
                    </div>

                    <div class="mt-6">
                        <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">Tendance Globale</label>
                        <select id="trend" class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-sm text-white">
                            <option value="bullish">HAUSSIER (Urgence)</option>
                            <option value="bearish" selected>BAISSIER (Opportunité)</option>
                            <option value="neutral">NEUTRE (Attente)</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 2. TRVE (PUBLIC) -->
            <div class="bento-card p-8 border-t-4 border-blue-600">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-lg font-bold text-blue-400"><i class="fa-solid fa-shield-halved mr-2"></i> TRVE (Public)</h2>
                    <i class="fa-solid fa-building-columns text-gray-600 text-2xl"></i>
                </div>
                
                <div class="space-y-6">
                    <div>
                        <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">ÉLEC - C5 (BLEU PRO) €/MWh</label>
                        <input type="number" id="trve-c5" class="input-market w-full py-3 text-blue-400 border-blue-500/30 focus:border-blue-500" value="230">
                    </div>
                    <div>
                        <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">ÉLEC - C4 (JAUNE) €/MWh</label>
                        <input type="number" id="trve-c4" class="input-market w-full py-3 text-blue-400 border-blue-500/30 focus:border-blue-500" value="180">
                    </div>
                    <div>
                        <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">GAZ - T1/T2 (PRIX REPÈRE) €/MWh</label>
                        <input type="number" id="trve-gaz" class="input-market w-full py-3 text-blue-400 border-blue-500/30 focus:border-blue-500" value="95">
                    </div>
                </div>
            </div>

            <!-- 3. CIBLES (BROKER) -->
            <div class="bento-card p-8 border-t-4 border-white">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-crosshairs mr-2"></i> CIBLES (Broker)</h2>
                    <i class="fa-solid fa-bullseye text-gray-600 text-2xl"></i>
                </div>
                
                <div class="space-y-6">
                    <div>
                        <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">CIBLE C5 (PETITS SITES)</label>
                        <input type="number" id="target-c5" class="input-market input-gold w-full py-3" value="190">
                    </div>
                    <div>
                        <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">CIBLE C4 (PME/INDUSTRIE)</label>
                        <input type="number" id="target-c4" class="input-market input-gold w-full py-3" value="140">
                    </div>
                    <div>
                        <label class="text-[9px] text-gray-400 uppercase font-bold mb-2 block">CIBLE GAZ (TOUTES TAILLES)</label>
                        <input type="number" id="target-gaz" class="input-market input-gold w-full py-3" value="85">
                    </div>
                </div>
            </div>

        </div>

        <!-- FOOTER ACTION -->
        <div class="p-8 flex justify-end items-center gap-4 bg-abysse/90 border-t border-white/10 sticky bottom-0 z-50">
            <span class="text-gray-500 text-xs font-bold uppercase mr-4">Retour Ops</span>
            <button onclick="broadcastRates()" id="btn-broadcast" class="bg-white text-black px-8 py-4 rounded-xl font-black text-sm hover:bg-cyan hover:scale-105 transition shadow-[0_0_30px_rgba(255,255,255,0.2)] flex items-center gap-3">
                <i class="fa-solid fa-tower-broadcast"></i> DIFFUSER LES RÉFÉRENCES
            </button>
        </div>

    </main>

    <script>
        // --- LOGIQUE DE TUYAUTERIE (CORRIGÉE) ---

        async function broadcastRates() {
            const btn = document.getElementById('btn-broadcast');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> DIFFUSION EN COURS...';
            
            // 1. CONSTRUCTION DU PAYLOAD (Format strict attendu par main.py)
            const payload = {
                elec: {
                    cal_n1: parseFloat(document.getElementById('eex-n1').value),
                    cal_n2: parseFloat(document.getElementById('eex-n2').value),
                    cal_n3: parseFloat(document.getElementById('eex-n3').value),
                    trend: document.getElementById('trend').value
                },
                gaz: {
                    peg_n1: parseFloat(document.getElementById('peg-n1').value),
                    peg_n2: parseFloat(document.getElementById('peg-n2').value),
                    peg_n3: parseFloat(document.getElementById('peg-n3').value)
                },
                trve: {
                    elec_c5: parseFloat(document.getElementById('trve-c5').value),
                    elec_c4: parseFloat(document.getElementById('trve-c4').value),
                    gaz_ref: parseFloat(document.getElementById('trve-gaz').value)
                },
                targets: {
                    c5: parseFloat(document.getElementById('target-c5').value),
                    c4: parseFloat(document.getElementById('target-c4').value),
                    gaz: parseFloat(document.getElementById('target-gaz').value)
                }
            };

            try {
                // 2. ENVOI AU SERVEUR
                const res = await fetch('/api/ops/market/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    // 3. SUCCÈS
                    const now = new Date();
                    document.getElementById('last-update').innerText = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
                    document.getElementById('last-update').classList.add('text-green-400');
                    
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> DIFFUSION RÉUSSIE';
                    btn.classList.replace('bg-white', 'bg-green-500');
                    
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.classList.replace('bg-green-500', 'bg-white');
                    }, 2000);
                } else {
                    throw new Error("Erreur Serveur");
                }
            } catch (e) {
                console.error(e);
                alert("Erreur de connexion au Cerveau.");
                btn.innerHTML = originalText;
            }
        }
    </script>
</body>
</html>
