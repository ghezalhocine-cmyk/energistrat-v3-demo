<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>404 | Signal Perdu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { abysse: '#050505', cyan: '#00E5FF', alert: '#EF4444' }, fontFamily: { mono: ['JetBrains Mono', 'monospace'] } } } }
    </script>
    <style>
        body { background: #050505; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .glitch { font-size: 8rem; font-weight: bold; text-shadow: 2px 2px #EF4444, -2px -2px #00E5FF; animation: glitch 1s infinite alternate; }
        @keyframes glitch { 0% { text-shadow: 2px 2px #EF4444, -2px -2px #00E5FF; } 100% { text-shadow: -2px 2px #EF4444, 2px -2px #00E5FF; } }
        .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.1); animation: scan 3s linear infinite; }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
    </style>
</head>
<body class="relative">
    <div class="scan-line"></div>
    <div class="text-center z-10">
        <div class="glitch mb-4">404</div>
        <h2 class="text-2xl font-mono text-cyan mb-2">SIGNAL PERDU</h2>
        <p class="text-gray-500 font-mono mb-8 max-w-md mx-auto">La page que vous cherchez a été délestée ou n'existe pas dans le réseau ENERGISTRAT.</p>
        
        <div class="flex gap-4 justify-center">
            <a href="/" class="px-6 py-3 border border-white/20 rounded-lg font-mono text-sm hover:bg-white/10 transition">RETOUR ACCUEIL</a>
            <a href="/nexus" class="px-6 py-3 bg-cyan text-abysse rounded-lg font-mono text-sm font-bold hover:bg-white transition">OUVRIR NEXUS</a>
        </div>
    </div>
    
    <!-- Background Noise -->
    <div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: url('https://grainy-gradients.vercel.app/noise.svg');"></div>
</body>
</html>
