<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CORTEX | Calibrage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>body { background: #000; color: #00E5FF; font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; }</style>
</head>
<body>
    <div class="text-center">
        <div class="text-5xl font-bold mb-2 tracking-tighter">CORTEX AI</div>
        <div class="text-xs text-gray-500 uppercase tracking-[0.3em] mb-8">Calibrage Profil : <span id="lbl-target" class="text-white">...</span></div>
        
        <div class="w-64 h-1 bg-gray-800 mx-auto rounded overflow-hidden mb-8">
            <div id="bar" class="h-full bg-cyan-500 w-0 transition-all duration-[2500ms] ease-out"></div>
        </div>

        <div id="logs" class="text-[10px] text-gray-400 space-y-1 h-20 overflow-hidden"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const target = params.get('target') || 'demo';
        document.getElementById('lbl-target').innerText = target.toUpperCase();

        // Animation Barre
        setTimeout(() => document.getElementById('bar').style.width = '100%', 100);

        // Animation Logs
        const logs = [
            "> Connexion sécurisée aux API...",
            "> Récupération des courbes de charge...",
            "> Analyse des pics de puissance...",
            "> Calcul du Score Vitalité...",
            "> Comparaison marchés Spot...",
            "> Génération du Dashboard..."
        ];
        
        let i = 0;
        const logContainer = document.getElementById('logs');
        const interval = setInterval(() => {
            if(i < logs.length) {
                logContainer.innerHTML += `<div class="text-cyan-400/80">${logs[i]}</div>`;
                i++;
            } else {
                clearInterval(interval);
                // REDIRECTION VERS LE ROUTEUR INTELLIGENT
                window.location.href = `/dashboard/${target}`;
            }
        }, 400); // Vitesse des logs
    </script>
</body>
</html>
