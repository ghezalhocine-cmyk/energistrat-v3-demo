<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT | Optimisation Contrats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { abysse: '#050505', card: '#0F172A', cyan: '#00E5FF', alert: '#F59E0B', success: '#10B981' }, fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } } }
    </script>
    <style>body { background-color: #050505; color: white; } .bento-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); }</style>
</head>
<body class="flex h-screen w-screen overflow-hidden text-sm font-sans">
    <aside class="w-16 bg-[#020617] border-r border-white/10 flex flex-col items-center py-6 z-50">
        <a href="/dashboard/industry" class="mb-8 text-gray-500 hover:text-white transition" title="Retour Cockpit"><i class="fa-solid fa-arrow-left text-xl"></i></a>
        <div class="w-10 h-10 rounded bg-cyan/20 text-cyan flex items-center justify-center mb-4"><i class="fa-solid fa-sliders"></i></div>
    </aside>

    <main class="flex-1 flex flex-col p-8 overflow-y-auto bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-black text-white">Optimisation Tarifaire</h1>
                <p class="text-gray-400 text-xs mt-1">Données calculées sur le parc réel</p>
            </div>
            <div class="text-right">
                <div class="text-xs text-gray-500 uppercase">Gisement d'économie</div>
                <div class="text-2xl font-mono font-bold text-success" id="total-savings">Calcul...</div>
            </div>
        </header>

        <div class="grid grid-cols-2 gap-8">
            <div class="bento-card p-8 rounded-2xl">
                <h2 class="text-xl font-bold text-white mb-6 flex items-center gap-3"><i class="fa-solid fa-bolt text-cyan"></i> Calibrage Puissance (TURPE)</h2>
                <div class="h-64 relative mb-6"><canvas id="turpeChart"></canvas></div>
                <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs text-gray-400">Puissance Souscrite Actuelle</span>
                        <span class="font-mono font-bold text-white" id="current-p">-- kVA</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-cyan">Optimum Calculé</span>
                        <span class="font-mono font-bold text-cyan" id="opti-p">-- kVA</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function init() {
            try {
                const res = await fetch('/api/physics/industry/global');
                const data = await res.json();
                
                if (data.turpe) {
                    const t = data.turpe;
                    document.getElementById('current-p').innerText = t.current_p + " kVA";
                    document.getElementById('opti-p').innerText = t.optimal_p + " kVA";
                    document.getElementById('total-savings').innerText = "+ " + t.potential_savings + " €/an";
                    
                    const ctx = document.getElementById('turpeChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: [t.optimal_p*0.8, t.optimal_p*0.9, t.optimal_p, t.optimal_p*1.1, t.optimal_p*1.2],
                            datasets: [{
                                label: 'Coût Total (€)',
                                data: [50000, 48000, 45000, 49000, 52000], // Simulé pour l'affichage courbe en U
                                borderColor: '#00E5FF', backgroundColor: 'rgba(0, 229, 255, 0.1)', fill: true, tension: 0.4
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false } } }
                    });
                }
            } catch(e) { console.error(e); }
        }
        init();
    </script>
</body>
</html>
