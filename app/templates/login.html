<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion Sécurisée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #000; color: white; font-family: 'Inter', sans-serif; }</style>
</head>
<body class="h-screen flex items-center justify-center bg-[url('https://grainy-gradients.vercel.app/noise.svg')]">

    <div class="w-full max-w-md p-8 bg-[#0F172A] rounded-3xl border border-white/10 shadow-2xl text-center">
        
        <!-- ICONE DYNAMIQUE -->
        <div class="w-16 h-16 bg-white/5 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl">
            <i id="profile-icon" class="fa-solid fa-bolt text-cyan-400"></i>
        </div>

        <h1 class="text-2xl font-bold mb-1 capitalize" id="profile-title">Connexion</h1>
        <p class="text-gray-500 text-sm mb-8">Espace sécurisé & Audit</p>

        <!-- SSO -->
        <button class="w-full bg-white text-black font-bold py-3 rounded-xl mb-3 flex items-center justify-center gap-3 hover:bg-gray-200 transition">
            <i class="fa-brands fa-google"></i> Continuer avec Google
        </button>
        <button class="w-full bg-[#2F2F2F] text-white font-bold py-3 rounded-xl mb-6 flex items-center justify-center gap-3 hover:bg-[#3F3F3F] transition">
            <i class="fa-brands fa-microsoft"></i> Microsoft Entra ID
        </button>

        <div class="border-t border-white/10 my-6 relative">
            <span class="bg-[#0F172A] px-2 text-xs text-gray-500 absolute top-[-10px] left-1/2 -translate-x-1/2">OU EMAIL</span>
        </div>

        <!-- FORM -->
        <input type="email" placeholder="Email" class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 mb-3 text-white focus:border-cyan-400 outline-none">
        <input type="password" placeholder="Mot de passe" class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 mb-6 text-white focus:border-cyan-400 outline-none">

        <!-- ACTION : VERS PROCESSING -->
        <button onclick="goProcessing()" class="w-full bg-cyan-400 hover:bg-cyan-300 text-black font-bold py-3 rounded-xl transition shadow-[0_0_20px_rgba(0,229,255,0.3)]">
            Se connecter
        </button>
    </div>

    <script>
        // Récupère le profil depuis l'URL (ex: /login/retail)
        const path = window.location.pathname;
        const profile = path.split('/').pop() || 'demo';

        // Mise à jour UI
        document.getElementById('profile-title').innerText = profile.toUpperCase();
        
        // Icônes dynamiques
        const icons = {
            'industrie': 'fa-industry', 'retail': 'fa-cart-shopping', 'mairie': 'fa-landmark',
            'sde': 'fa-bolt', 'oph': 'fa-building', 'syndic': 'fa-city', 'citoyen': 'fa-house'
        };
        if(icons[profile]) document.getElementById('profile-icon').className = `fa-solid ${icons[profile]} text-cyan-400`;

        // REDIRECTION CRITIQUE
        function goProcessing() {
            // On envoie vers la page de chargement avec le paramètre cible
            window.location.href = `/processing?target=${profile}`;
        }
    </script>
</body>
</html>
