<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENERGISTRAT V3 | Portail de Sécurité</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = { 
            theme: { extend: { colors: { abysse: '#001529', cyan: '#00E5FF', card: '#0F172A', alert: '#EF4444' }, fontFamily: { sans:['Inter', 'sans-serif'], mono:['JetBrains Mono', 'monospace'] } } } 
        }
    </script>
    <style>
        body { background-color: #001529; color: #e2e8f0; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .bg-grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px); background-size: 40px 40px; z-index: 0; }
        .glow { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(0,229,255,0.15) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; pointer-events: none; }
        .bento-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); position: relative; z-index: 10; width: 100%; max-w: 480px; padding: 3rem; }
        input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; color: white; transition: all 0.3s; }
        input:focus { border-color: #00E5FF; outline: none; box-shadow: 0 0 15px rgba(0,229,255,0.2); }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="glow"></div>

    <div class="bento-card">
        <div class="flex justify-center mb-6">
            <svg width="60" height="60" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="25" x="20" y="20" fill="#00E5FF"/>
                <path d="M45 70L80 70L62 105Z" fill="#001529"/>
            </svg>
        </div>
        <h1 class="text-3xl font-black text-center text-white tracking-tight mb-2">ENERGISTRAT<span class="text-cyan">.V3</span></h1>
        <p class="text-center text-gray-400 text-xs font-mono mb-8 uppercase tracking-widest">Enterprise Identity Platform</p>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Adresse E-mail</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="email" id="email" class="w-full py-4 pl-12 pr-4 text-sm font-mono" placeholder="dirigeant@energistrat.com" required>
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Mot de passe</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="password" id="password" class="w-full py-4 pl-12 pr-4 text-sm font-mono" placeholder="••••••••••••" required>
                </div>
            </div>

            <div id="error-msg" class="hidden bg-alert/10 border border-alert/30 text-alert text-xs p-3 rounded-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i> <span>Identifiants incorrects.</span>
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-cyan text-abysse font-black py-4 rounded-xl shadow-[0_0_20px_rgba(0,229,255,0.4)] hover:bg-white transition flex justify-center items-center gap-3">
                <span id="btn-text">DÉVERROUILLER L'ACCÈS</span>
                <i class="fa-solid fa-arrow-right" id="btn-icon"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-white/5 flex items-center justify-center gap-2 text-[10px] text-gray-500">
            <i class="fa-solid fa-shield-halved text-success"></i> 
            <span>Protégé par Google Firebase Authentication & MFA</span>
        </div>
    </div>

    <!-- SDK FIREBASE V9 (MODULAR) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // LES CLÉS DE TON SAAS (GÉNÉRALEMENT PUBLIQUES)
        const firebaseConfig = {
            apiKey: "AIzaSyBMn-3l7kYmllgYkx-8ORsf8uU-HCZGJ-k",
            authDomain: "energistrat-saas.firebaseapp.com",
            projectId: "energistrat-saas",
            storageBucket: "energistrat-saas.firebasestorage.app",
            messagingSenderId: "1073946643054",
            appId: "1:1073946643054:web:0f75b60837faa0b257f47f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const errorMsg = document.getElementById('error-msg');
            
            btnText.innerText = "AUTHENTIFICATION...";
            btnIcon.className = "fa-solid fa-spinner fa-spin";
            errorMsg.classList.add('hidden');

            try {
                // 1. On demande à Firebase de vérifier l'utilisateur
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                
                // 2. Si OK, on récupère le jeton crypté (ID Token)
                const idToken = await userCredential.user.getIdToken();

                // 3. On envoie ce jeton à NOTRE API Backend pour créer le Cookie de Session
                const res = await fetch('/api/auth/session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_token: idToken })
                });

                if (res.ok) {
                    btnText.innerText = "ACCÈS AUTORISÉ";
                    btnIcon.className = "fa-solid fa-check";
                    setTimeout(() => window.location.href = "/ops_nexus", 800);
                } else {
                    throw new Error("Erreur de session Backend.");
                }

            } catch (error) {
                console.error("Login Failed:", error.code, error.message);
                btnText.innerText = "DÉVERROUILLER L'ACCÈS";
                btnIcon.className = "fa-solid fa-arrow-right";
                errorMsg.classList.remove('hidden');
                
                if(error.code === 'auth/multi-factor-auth-required') {
                    // TODO: Gestion visuelle du MFA (SMS) à intégrer dans la prochaine évolution
                    errorMsg.innerHTML = '<i class="fa-solid fa-mobile"></i> <span>Double authentification (MFA) requise.</span>';
                } else {
                    errorMsg.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> <span>Identifiants incorrects.</span>';
                }
            }
        });
    </script>
</body>
</html>
