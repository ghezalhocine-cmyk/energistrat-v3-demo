<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CONNEXION | ENERGISTRAT V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        abysse: '#050505',
                        card: '#0F172A',
                        cyan: '#00E5FF',
                        gold: '#F59E0B',
                        danger: '#EF4444',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: white; overflow: hidden; }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.05);
        }
        .input-cyber {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .input-cyber:focus {
            border-color: #00E5FF;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            outline: none;
        }
    </style>
</head>
<body class="flex h-screen w-screen items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">

    <!-- DECORATION CERCLES -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] border border-white/5 rounded-full animate-spin-slow pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] border border-cyan/10 rounded-full pointer-events-none"></div>

    <!-- CARTE LOGIN -->
    <div class="glass-card w-96 rounded-2xl p-8 z-10 relative">
        
        <!-- HEADER -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-cyan/10 text-cyan mb-4 border border-cyan/20">
                <i class="fa-solid fa-bolt text-xl"></i>
            </div>
            <h1 class="text-2xl font-black tracking-wider text-white">ENERGISTRAT</h1>
            <p class="text-[10px] text-gray-500 font-mono mt-1">SECURE ACCESS GATEWAY</p>
        </div>

        <!-- FORMULAIRE -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            
            <!-- EMAIL -->
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Identifiant</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-gray-600 text-xs"></i>
                    </div>
                    <input type="email" id="email" required 
                        class="input-cyber w-full rounded-lg py-2.5 pl-9 pr-3 text-sm placeholder-gray-600"
                        placeholder="admin@energistrat.com">
                </div>
            </div>

            <!-- PASSWORD -->
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1 uppercase">Mot de Passe</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-600 text-xs"></i>
                    </div>
                    <input type="password" id="password" required 
                        class="input-cyber w-full rounded-lg py-2.5 pl-9 pr-3 text-sm placeholder-gray-600"
                        placeholder="••••••••">
                </div>
            </div>

            <!-- MFA (CACHÉ PAR DÉFAUT) -->
            <div id="mfa-section" class="hidden animate-pulse">
                <label class="block text-xs font-bold text-gold mb-1 uppercase flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved"></i> Code Double Auth
                </label>
                <input type="text" id="mfa_code" maxlength="6"
                    class="input-cyber w-full rounded-lg py-2.5 text-center text-lg tracking-[0.5em] font-mono text-gold border-gold/30 focus:border-gold"
                    placeholder="000000">
            </div>

            <!-- ERROR MESSAGE -->
            <div id="error-msg" class="hidden text-xs text-danger font-bold text-center bg-danger/10 p-2 rounded border border-danger/20">
                Identifiants incorrects.
            </div>

            <!-- BUTTON -->
            <button type="submit" id="submit-btn" class="w-full bg-cyan hover:bg-cyan/80 text-black font-bold py-2.5 rounded-lg transition duration-200 transform active:scale-95">
                CONNEXION SÉCURISÉE
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-[9px] text-gray-600">
                <i class="fa-solid fa-lock mr-1"></i> Chiffrage AES-256 / TLS 1.3
            </p>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const mfaCode = document.getElementById('mfa_code').value;
            const btn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-msg');

            // UI Loading
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> VERIFICATION...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: email, 
                        password: password,
                        mfa_code: mfaCode || null
                    })
                });

                const data = await res.json();

                if (res.status === 200) {
                    // SUCCÈS -> Redirection Dashboard
                    window.location.href = "/dashboard/industry";
                } else if (res.status === 403 && data.detail === "MFA_REQUIRED") {
                    // MFA REQUIS -> On affiche le champ
                    document.getElementById('mfa-section').classList.remove('hidden');
                    document.getElementById('mfa_code').focus();
                    btn.innerHTML = 'VALIDER CODE';
                    btn.className = "w-full bg-gold hover:bg-gold/80 text-black font-bold py-2.5 rounded-lg transition";
                    btn.disabled = false;
                } else {
                    // ERREUR
                    throw new Error(data.detail || "Erreur connexion");
                }

            } catch (err) {
                console.error(err);
                errorMsg.innerText = "Accès Refusé : " + err.message;
                errorMsg.classList.remove('hidden');
                btn.innerHTML = 'CONNEXION SÉCURISÉE';
                btn.disabled = false;
                // Animation Shake
                const card = document.querySelector('.glass-card');
                card.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300 });
            }
        }
    </script>
</body>
</html>
