<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT V3 | Retail Cortex</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { abysse:'#050505', card:'#0F172A', retail:'#A855F7', cyan:'#00E5FF', ai:'#8B5CF6' }, borderRadius: { 'bento':'2rem' }, boxShadow: { 'neon':'0 0 20px rgba(168,85,247,0.25)' } } } }
    </script>
    <style>
        body { background:#050505; color:white; height:100vh; overflow:hidden; display:flex; }
        .bento-card { background:#0F172A; border:1px solid rgba(255,255,255,0.05); transition:0.3s; }
        .bento-card:hover { border-color:rgba(139,92,246,0.4); transform:translateY(-2px); box-shadow:0 10px 40px rgba(0,0,0,0.5); z-index:10; }
        .nav-item.active { background:rgba(139,92,246,0.1); border-right:3px solid #8B5CF6; color:white; }
        .page-content { display:none; } .page-content.active { display:grid; }
    </style>
</head>
<body class="font-sans">
    <aside class="w-64 bg-[#020617] border-r border-white/5 flex flex-col justify-between h-full z-50">
        <div>
            <div class="p-6 flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border-2 border-ai flex items-center justify-center bg-abysse text-ai font-bold shadow-neon">AI</div>
                <div><div class="font-black text-lg">CORTEX<span class="text-ai">.AI</span></div><div class="text-[9px] text-gray-400">Retail Group</div></div>
            </div>
            <nav class="mt-4 flex flex-col">
                <button onclick="navTo('cockpit')" id="btn-cockpit" class="nav-item active w-full text-left px-6 py-4 text-xs font-bold uppercase tracking-wider">1. Cockpit IA</button>
                <button onclick="navTo('trading')" id="btn-trading" class="nav-item w-full text-left px-6 py-4 text-xs font-bold uppercase tracking-wider">2. Trading</button>
                <button onclick="navTo('tech')" id="btn-tech" class="nav-item w-full text-left px-6 py-4 text-xs font-bold uppercase tracking-wider">3. Tech</button>
                <button onclick="navTo('rse')" id="btn-rse" class="nav-item w-full text-left px-6 py-4 text-xs font-bold uppercase tracking-wider">4. RSE</button>
            </nav>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-full bg-abysse relative">
        <header class="h-20 border-b border-white/5 flex items-center justify-between px-8 bg-abysse/95 backdrop-blur">
            <h2 id="page-title" class="text-3xl font-black text-white">Cockpit Stratégique IA</h2>
            <div class="flex items-center gap-4 bg-card border border-white/5 px-4 py-2 rounded-full"><span class="text-xs text-gray-400 font-bold">Budget</span><span class="text-sm font-bold text-white">4.2 M€</span></div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 scroll-smooth">
            <div id="view-cockpit" class="page-content active grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-4 bg-card rounded-bento p-6 border border-ai/20 bento-card h-[500px]">
                    <h3 class="font-bold text-lg text-white mb-4">Flux Neural</h3>
                    <div class="space-y-4">
                        <div class="bg-abysse/50 p-4 rounded-xl border border-ai/20"><span class="text-[9px] bg-ai/20 text-ai px-2 rounded">AUTO-FIX</span><p class="text-xs text-gray-300 mt-1">Dérive CVC Lyon corrigée. Gain: 145€.</p></div>
                    </div>
                </div>
                <div class="col-span-8 bg-card rounded-bento p-8 bento-card h-[500px]">
                    <h3 class="font-bold text-xl text-white mb-4">Projection What-If</h3>
                    <canvas id="predictiveChart" class="w-full h-64"></canvas>
                </div>
            </div>
             <!-- Placeholders pour les autres vues -->
             <div id="view-trading" class="page-content grid grid-cols-12 gap-6 auto-rows-min"><div class="col-span-12 text-center text-gray-500 mt-20">Vue Trading</div></div>
             <div id="view-tech" class="page-content grid grid-cols-12 gap-6 auto-rows-min"><div class="col-span-12 text-center text-gray-500 mt-20">Vue Tech</div></div>
             <div id="view-rse" class="page-content grid grid-cols-12 gap-6 auto-rows-min"><div class="col-span-12 text-center text-gray-500 mt-20">Vue RSE</div></div>
        </main>
    </div>

    <script>
        function navTo(p){document.querySelectorAll('.nav-item').forEach(e=>{e.classList.remove('active');e.classList.add('text-gray-400')});document.getElementById('btn-'+p).classList.add('active');document.getElementById('btn-'+p).classList.remove('text-gray-400');document.querySelectorAll('.page-content').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+p).classList.add('active');if(p==='cockpit')renderChart();}
        function renderChart(){const ctx=document.getElementById('predictiveChart').getContext('2d');new Chart(ctx,{type:'line',data:{labels:['L','M','M','J','V','S','D'],datasets:[{label:'Standard',data:[100,105,102,108,110,115,90],borderColor:'#64748B'},{label:'Optimisé',data:[85,88,86,90,92,95,75],borderColor:'#8B5CF6'}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{display:false},y:{display:false}}}});}
        setTimeout(renderChart, 100);
    </script>
</body>
</html>
