<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT V3 | Ops Mastermind</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { abysse: '#050505', card: '#0F172A', ops: '#F43F5E', data: '#8B5CF6', gold: '#FFD700', cyan: '#00E5FF' }, borderRadius: { 'bento': '2rem' }, boxShadow: { 'neon': '0 0 20px rgba(244, 63, 94, 0.25)' } } } }
    </script>
    <style>body { background: #050505; color: white; height: 100vh; overflow: hidden; display: flex; } .bento-card { background: #0F172A; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; } .bento-card:hover { border-color: rgba(244, 63, 94, 0.5); transform: translateY(-2px); z-index: 10; } .nav-item.active { background: rgba(244, 63, 94, 0.1); border-right: 3px solid #F43F5E; color: white; } .page-content { display: none; } .page-content.active { display: grid; }</style>
</head>
<body class="font-sans">
    <aside class="w-64 bg-[#020617] border-r border-white/5 flex flex-col justify-between h-full z-50">
        <div>
            <div class="p-6 flex items-center gap-3"><div class="w-10 h-10 rounded-full border-2 border-ops flex items-center justify-center bg-abysse text-ops font-bold shadow-neon">OPS</div><div><div class="font-black text-lg">OPS<span class="text-ops">.MASTER</span></div><div class="text-[9px] text-gray-400">Internal Admin</div></div></div>
            <nav class="mt-4 flex flex-col">
                <button onclick="navTo('marketing')" id="btn-marketing" class="nav-item active w-full text-left px-6 py-4 text-xs font-bold uppercase">1. Marketing Data</button>
                <button onclick="navTo('audit')" id="btn-audit" class="nav-item w-full text-left px-6 py-4 text-xs font-bold uppercase">2. Audit & Cortex</button>
                <button onclick="navTo('connect')" id="btn-connect" class="nav-item w-full text-left px-6 py-4 text-xs font-bold uppercase">3. Connecteurs</button>
                <button onclick="navTo('data')" id="btn-data" class="nav-item w-full text-left px-6 py-4 text-xs font-bold uppercase">4. Data Factory</button>
            </nav>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-full bg-abysse relative">
        <header class="h-20 border-b border-white/5 flex items-center justify-between px-8 bg-abysse/95 backdrop-blur z-20"><h2 id="page-title" class="text-3xl font-black text-white">Marketing Studio</h2><div class="text-xs text-gold font-bold">Rev. Data: +85k€</div></header>
        <main class="flex-1 overflow-y-auto p-8 scroll-smooth">
            
            <!-- MARKETING -->
            <div id="view-marketing" class="page-content active grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-8 bg-card rounded-bento p-8 bento-card border-t-4 border-data">
                    <h3 class="font-bold text-xl mb-6">Clustering Comportemental</h3>
                    <canvas id="clusterChart" class="w-full h-64"></canvas>
                </div>
                <div class="col-span-4 bg-gradient-to-b from-card to-abysse border-t-4 border-gold rounded-bento p-8 bento-card">
                    <h3 class="font-bold text-lg mb-4">Data Brokerage</h3>
                    <div class="bg-abysse/80 p-4 rounded-2xl border border-white/10 mb-4"><span class="text-xs font-bold">Segment "EV Owners"</span><div class="text-right text-gold font-mono text-xs">45 € / lead</div></div>
                    <button class="w-full bg-gold text-abysse font-bold py-2 rounded-xl text-xs">Vendre Segment</button>
                </div>
            </div>

            <!-- AUDIT -->
            <div id="view-audit" class="page-content grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-8 bg-card rounded-bento p-8 bento-card"><h3 class="font-bold text-xl mb-6">Radar Conformité</h3><canvas id="radarChart" class="w-full h-64"></canvas></div>
            </div>
            
            <!-- CONNECT -->
            <div id="view-connect" class="page-content grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-12 bg-card rounded-bento p-8 bento-card"><h3 class="font-bold text-xl mb-6">Hub Intégration</h3><div class="bg-abysse p-4 rounded-2xl border border-white/10 mb-2 flex justify-between"><span>SAP S/4HANA</span><span class="text-success text-xs">SYNC</span></div></div>
            </div>

             <!-- DATA -->
            <div id="view-data" class="page-content grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-12 bg-abysse border border-dashed border-gray-600 rounded-bento p-12 text-center"><h3 class="font-bold text-white">Import Masse</h3></div>
            </div>
        </main>
    </div>
    <script>
        function navTo(p){document.querySelectorAll('.nav-item').forEach(e=>{e.classList.remove('active');e.classList.add('text-gray-400')});document.getElementById('btn-'+p).classList.add('active');document.getElementById('btn-'+p).classList.remove('text-gray-400');document.querySelectorAll('.page-content').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+p).classList.add('active'); if(p==='marketing')renderCluster(); if(p==='audit')renderRadar();}
        function renderCluster(){const ctx=document.getElementById('clusterChart').getContext('2d');new Chart(ctx,{type:'bubble',data:{datasets:[{label:'EV',data:[{x:10,y:20,r:10},{x:15,y:10,r:15}],backgroundColor:'#00E5FF'}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{display:false},y:{display:false}}}});}
        function renderRadar(){const ctx=document.getElementById('radarChart').getContext('2d');new Chart(ctx,{type:'radar',data:{labels:['DPE','CSRD','CEE','ISO'],datasets:[{label:'Conformité',data:[80,40,90,70],borderColor:'#F59E0B',backgroundColor:'rgba(245,158,11,0.2)'}]},options:{responsive:true,maintainAspectRatio:false,scales:{r:{grid:{color:'#333'},ticks:{display:false}}}}});}
        setTimeout(renderCluster, 100);
    </script>
</body>
</html>
