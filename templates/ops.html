<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT V5.4 | Ops OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = { theme: { extend: { colors: { abysse: '#050505', card: '#0F172A', ops: '#F43F5E', ai: '#A855F7', cyan: '#00E5FF', success: '#10B981' }, fontFamily: { sans: ['Inter'], mono: ['JetBrains Mono'] } } } }
    </script>
    
    <style>
        body { background: #050505; color: #e2e8f0; overflow: hidden; }
        .ops-grid { display: grid; grid-template-columns: 70px 1fr 350px; height: 100vh; }
        .bento-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .nav-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #64748B; cursor: pointer; transition: all 0.2s; margin-bottom: 1rem; }
        .nav-icon.active { background: rgba(244, 63, 94, 0.1); color: #F43F5E; }
        .page-content { display: none; opacity: 0; animation: fadeIn 0.3s forwards; }
        .page-content.active { display: grid; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        #drop-zone.drag-active { border-color: #00E5FF; background-color: rgba(0, 229, 255, 0.1); }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast { background: #1e293b; color: white; padding: 12px 20px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #00E5FF; }
        
        #terminal { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
        .log-line { margin-bottom: 2px; }
        .log-success { color: #4ade80; }
        .log-error { color: #f87171; }
        .log-info { color: #94a3b8; }
    </style>
</head>
<body class="ops-grid">

    <div id="toast-container"></div>

    <!-- SIDEBAR -->
    <aside class="bg-[#020617] border-r border-white/5 flex flex-col items-center py-6 z-20">
        <div class="w-10 h-10 rounded-lg bg-ops/20 text-ops flex items-center justify-center font-bold mb-8">OP</div>
        <nav class="flex flex-col w-full items-center">
            <div onclick="navTo('datalab')" id="nav-datalab" class="nav-icon active"><i class="fa-solid fa-flask text-xl"></i></div>
            <div onclick="navTo('auditlab')" id="nav-auditlab" class="nav-icon"><i class="fa-solid fa-file-invoice-dollar text-xl"></i></div>
            <div onclick="navTo('scenarios')" id="nav-scenarios" class="nav-icon"><i class="fa-solid fa-bomb text-xl"></i></div>
        </nav>
        <a href="/" class="mt-auto nav-icon"><i class="fa-solid fa-house"></i></a>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col relative bg-abysse overflow-hidden">
        <header class="h-12 border-b border-white/5 bg-yellow-500/5 flex items-center justify-between px-6">
            <div class="flex items-center gap-3"><i class="fa-solid fa-box-open text-gold"></i><span class="text-xs font-bold text-gold uppercase">OPS V5.4</span></div>
            <div class="text-[10px] font-mono text-gray-400"><span class="w-2 h-2 rounded-full bg-green-500 animate-pulse inline-block mr-2"></span>ONLINE</div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">

            <!-- TAB 1: DATA LAB -->
            <div id="view-datalab" class="page-content active grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-12 md:col-span-4 bento-card p-6 rounded-2xl border-t-4 border-cyan flex flex-col">
                    <h3 class="font-bold text-white mb-2">Ingestion SGE</h3>
                    
                    <!-- MENU DÉROULANT COMPLET -->
                    <select id="target-client" class="w-full bg-abysse border border-white/20 rounded-lg text-xs text-white p-2 mb-4 focus:border-cyan outline-none">
                        <option value="demo">-- Sélectionner Profil --</option>
                        <option value="industry">Industrie (ISO 50001)</option>
                        <option value="mairie">Collectivité (Mairie)</option>
                        <option value="retail">Retail / Franchise</option>
                        <option value="pme">Artisan / PME</option>
                        <option value="sde">Syndicat (SDE)</option>
                        <option value="oph">Bailleur Social (OPH)</option>
                        <option value="syndic">Syndic Copro</option>
                        <option value="citoyen">Particulier</option>
                        <option value="supplier">Partenaire</option>
                    </select>

                    <div id="drop-zone" class="flex-1 border-2 border-dashed border-gray-600 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-cyan transition py-8" onclick="document.getElementById('real-upload').click()">
                        <input type="file" id="real-upload" class="hidden" accept=".csv, .xlsx" onchange="handleFileSelect(this.files[0])">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-500 mb-2"></i>
                        <span class="text-xs font-bold text-white" id="upload-label">Glisser un fichier</span>
                    </div>
                </div>

                <div class="col-span-12 md:col-span-8 bento-card p-6 rounded-2xl">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-white">Analyse de Charge</h3>
                        <div class="flex gap-2">
                            <button onclick="updateZoom(7)" class="px-2 py-1 bg-white/10 text-[10px] text-white rounded hover:bg-white/20">7J</button>
                            <button onclick="updateZoom(30)" class="px-2 py-1 bg-white/10 text-[10px] text-white rounded hover:bg-white/20">30J</button>
                            <button onclick="updateZoom('all')" class="px-2 py-1 bg-cyan/20 text-[10px] text-cyan rounded hover:bg-cyan/30">TOUT</button>
                        </div>
                    </div>
                    <div class="h-64 w-full relative"><canvas id="testChart"></canvas></div>
                </div>
            </div>

            <!-- TAB 2: AUDIT -->
            <div id="view-auditlab" class="page-content grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-12 mb-2"><h3 class="font-bold text-white text-lg">Audit Expert (TURPE & Taxes)</h3></div>
                
                <div class="col-span-6 bento-card p-6 rounded-2xl border border-red-500/30 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-red-500/20 flex items-center justify-center text-red-500"><i class="fa-solid fa-file-invoice-dollar text-xl"></i></div>
                    <div class="flex-1">
                        <label class="text-xs font-bold text-gray-400 block mb-1">1. FACTURE PDF</label>
                        <input type="file" id="invoice-file" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-white/10 file:text-white hover:file:bg-white/20">
                    </div>
                </div>

                <div class="col-span-6 bento-card p-6 rounded-2xl border border-blue-500/30 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-500"><i class="fa-solid fa-file-contract text-xl"></i></div>
                    <div class="flex-1">
                        <label class="text-xs font-bold text-gray-400 block mb-1">2. CONTRAT PDF</label>
                        <input type="file" id="contract-file" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-white/10 file:text-white hover:file:bg-white/20">
                    </div>
                </div>

                <div class="col-span-12">
                    <button onclick="runRealAudit()" class="w-full py-4 bg-gradient-to-r from-cyan to-blue-600 text-white font-bold rounded-xl text-sm hover:scale-[1.01] transition shadow-lg">LANCER L'AUDIT DE PERFORMANCE</button>
                </div>

                <div class="col-span-12 bento-card p-6 rounded-2xl bg-abysse border border-white/10 mt-4">
                    <table class="w-full text-left text-xs text-gray-300">
                        <thead class="text-gray-500 border-b border-white/10"><tr><th>Point de Contrôle</th><th>Donnée Facture</th><th>Donnée Contrat</th><th class="text-right">Résultat</th></tr></thead>
                        <tbody id="audit-results" class="divide-y divide-white/5"><tr><td colspan="4" class="py-4 text-gray-500 italic">En attente de documents...</td></tr></tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 3: CHAOS -->
            <div id="view-scenarios" class="page-content grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-12 bento-card p-6 rounded-2xl border-l-4 border-red-500">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-white text-lg">Chaos Monkey</h3>
                        <button onclick="runTest()" class="px-4 py-2 bg-red-600 text-white font-bold rounded hover:bg-red-500 text-xs">TESTER INFRA</button>
                    </div>
                    <div id="chaos-results" class="grid grid-cols-3 gap-4"></div>
                </div>
            </div>

        </div>

        <!-- TERMINAL -->
        <div class="h-40 bg-[#02050a] border-t border-white/10 p-4 overflow-hidden flex flex-col z-20">
            <div class="flex justify-between items-center mb-1 border-b border-white/5 pb-1">
                <span class="text-slate-500 font-bold uppercase tracking-widest text-[10px]">>> SYSTEM LOGS</span>
                <button onclick="document.getElementById('terminal').innerHTML=''" class="text-[10px] text-gray-600 hover:text-white">CLEAR</button>
            </div>
            <div id="terminal" class="flex-1 overflow-y-auto space-y-1"></div>
        </div>

    </main>

    <!-- CHATBOT -->
    <aside class="bg-[#0B0F19] border-l border-white/5 flex flex-col w-[350px] z-30">
        <div class="p-4 border-b border-white/5 bg-ai/5 flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-ai flex items-center justify-center text-white font-bold"><i class="fa-solid fa-robot"></i></div>
            <h3 class="font-bold text-white text-sm">CORTEX</h3>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-4" id="chat-container"></div>
        <div class="p-4 border-t border-white/5">
            <input type="text" id="chat-input" placeholder="Message..." class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-xs text-white outline-none" onkeypress="if(event.key==='Enter') sendChat()">
        </div>
    </aside>

    <script>
        function log(msg, type='info') {
            const term = document.getElementById('terminal');
            const time = new Date().toLocaleTimeString();
            let colorClass = 'log-info';
            if(type === 'success') colorClass = 'log-success';
            if(type === 'error') colorClass = 'log-error';
            term.innerHTML += `<div class="log-line ${colorClass}">[${time}] ${msg}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        const App = {
            toast: function(msg, type='info') {
                const el = document.createElement('div');
                el.className = 'toast';
                el.style.borderLeftColor = type==='success'?'#10B981':(type==='error'?'#EF4444':'#00E5FF');
                el.innerText = msg;
                document.getElementById('toast-container').appendChild(el);
                setTimeout(() => el.remove(), 4000);
            }
        };

        function navTo(pageId) {
            document.querySelectorAll('.nav-icon').forEach(e => e.classList.remove('active'));
            document.getElementById('nav-' + pageId).classList.add('active');
            document.querySelectorAll('.page-content').forEach(e => e.classList.remove('active'));
            document.getElementById('view-' + pageId).classList.add('active');
        }

        // --- CHART JS (MOYENNE MOBILE) ---
        let testChart = null;
        let fullData = { labels: [], values: [], average: [] };

        function renderTestChart(labels, values, average) {
            fullData = { labels, values, average };
            updateZoom('all');
        }

        function updateZoom(range) {
            if(!fullData.values.length) return;
            let limit = fullData.values.length;
            if(range === 7) limit = 7 * 24; 
            if(range === 30) limit = 30 * 24;

            const slicedLabels = fullData.labels.slice(-limit);
            const slicedValues = fullData.values.slice(-limit);
            const slicedAverage = fullData.average.slice(-limit);

            const ctx = document.getElementById('testChart').getContext('2d');
            if (testChart) testChart.destroy();
            
            testChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: slicedLabels,
                    datasets: [
                        {
                            label: 'Puissance (kW)',
                            data: slicedValues,
                            borderColor: '#00E5FF',
                            backgroundColor: 'rgba(0, 229, 255, 0.1)',
                            fill: true,
                            pointRadius: 0,
                            borderWidth: 1.5
                        },
                        {
                            label: 'Tendance (Moyenne Mobile)',
                            data: slicedAverage,
                            borderColor: '#F59E0B',
                            borderDash: [5, 5],
                            pointRadius: 0,
                            borderWidth: 1.5,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true }, title: { display: true, text: 'Analyse de Charge', color: '#fff' } },
                    scales: { 
                        x: { display: true, ticks: { color: '#64748B', maxTicksLimit: 8 } },
                        y: { display: true, title: { display: true, text: 'Puissance (kW)', color: '#64748B' }, ticks: { color: '#64748B' } } 
                    }
                }
            });
        }

        async function handleFileSelect(file) {
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('target', document.getElementById('target-client').value);
            
            log(`Upload SGE: ${file.name}`, 'info');
            App.toast('Analyse en cours...', 'info');
            
            try {
                const res = await fetch('/api/ops/analyze', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    log(`Succès! ${data.kpi.points_traites} points traités.`, 'success');
                    App.toast('Succès !', 'success');
                    renderTestChart(data.chart.labels, data.chart.values, data.chart.average);
                    document.getElementById('chat-container').innerHTML += `<div class="ai-msg">${data.ai_insight}</div>`;
                } else throw new Error(data.error);
            } catch (e) { log(e.message, 'error'); App.toast('Erreur', 'error'); }
        }

        async function runRealAudit() {
            const inv = document.getElementById('invoice-file').files[0];
            const ctr = document.getElementById('contract-file').files[0];
            if(!inv || !ctr) return App.toast("Manque Facture ou Contrat", "error");

            log("Démarrage Audit PDF...", "info");
            const fd = new FormData(); fd.append('invoice', inv); fd.append('contract', ctr);
            
            try {
                const res = await fetch('/api/ops/audit', {method:'POST', body:fd});
                const data = await res.json();
                let html = '';
                data.checks.forEach(c => {
                    const color = c.error ? 'text-red-400' : 'text-green-400';
                    html += `<tr><td class="py-2">${c.point}</td><td>${c.a}</td><td>${c.b}</td><td class="text-right ${color} font-bold">${c.status}</td></tr>`;
                });
                document.getElementById('audit-results').innerHTML = html;
                log(`Audit terminé. Score: ${data.score}/100`, "success");
            } catch(e) { log("Erreur Audit", "error"); }
        }

        async function runTest() {
            log("Lancement Chaos Monkey...", "info");
            try {
                const res = await fetch('/api/ops/chaos', {method:'POST'});
                const data = await res.json();
                const div = document.getElementById('chaos-results');
                div.innerHTML = '';
                data.results.forEach(r => {
                    const bg = r.status.includes('PASS') ? 'bg-green-900/30 border-green-500' : 'bg-red-900/30 border-red-500';
                    div.innerHTML += `<div class="${bg} border p-2 rounded text-xs"><div class="font-bold text-white">${r.test}</div><div class="text-gray-300">${r.status}</div></div>`;
                    log(`${r.test}: ${r.status}`, r.status.includes('PASS')?'success':'error');
                });
            } catch(e) { log("Erreur Chaos", "error"); }
        }

        async function sendChat() {
            const txt = document.getElementById('chat-input').value;
            if(!txt) return;
            document.getElementById('chat-input').value = '';
            document.getElementById('chat-container').innerHTML += `<div class="user-msg">${txt}</div>`;
            
            const fd = new FormData(); fd.append('message', txt);
            const res = await fetch('/api/ops/chat', {method:'POST', body:fd});
            const data = await res.json();
            document.getElementById('chat-container').innerHTML += `<div class="ai-msg">${data.response}</div>`;
        }

        log('Ops V5.4 chargé. Modules actifs.', 'success');
    </script>
</body>
</html>
