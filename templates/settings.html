<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paramètres | ENERGISTRAT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; }
        /* CORRECTION ICI : border-radius au lieu de rounded-lg */
        .input-box { 
            background: #0F172A; 
            border: 1px solid #1E293B; 
            color: white; 
            padding: 10px; 
            border-radius: 0.5rem; 
            width: 100%; 
            outline: none; 
            transition: border-color 0.2s;
        }
        .input-box:focus { border-color: #00E5FF; }
        .section-title { color: #94A3B8; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 1rem; letter-spacing: 0.05em; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    
    <aside class="w-64 bg-[#020617] border-r border-white/5 flex flex-col justify-between p-6">
        <div>
            <div class="flex items-center gap-3 mb-8 cursor-pointer group" onclick="window.history.back()">
                <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-[#00E5FF] group-hover:text-black transition-all">←</div>
                <div class="font-bold group-hover:text-[#00E5FF] transition-colors">Retour</div>
            </div>
            <nav class="space-y-2">
                <div class="p-3 bg-[#00E5FF]/10 text-[#00E5FF] rounded-xl text-sm font-bold border border-[#00E5FF]/20">Général</div>
                <div class="p-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl cursor-pointer transition">Facturation</div>
                <div class="p-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl cursor-pointer transition">Sécurité & API</div>
                <div class="p-3 text-gray-400 hover:text-white hover:bg-white/5 rounded-xl cursor-pointer transition">Notifications</div>
            </nav>
        </div>
        <button class="w-full border border-red-500/50 text-red-500 py-2 rounded-lg text-xs hover:bg-red-500 hover:text-white transition" onclick="window.location.href='index.html'">Déconnexion</button>
    </aside>

    <main class="flex-1 overflow-y-auto p-12 bg-[radial-gradient(circle_at_top_right,_#001529_0%,_#050505_40%)]">
        <h1 class="text-4xl font-black mb-10 tracking-tighter italic uppercase">Paramètres <span class="text-[#00E5FF]">Compte</span></h1>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 max-w-5xl">
            <div class="space-y-8">
                <div>
                    <div class="section-title">Profil Public</div>
                    <div class="flex items-center gap-6 mb-6">
                        <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-[#00E5FF] to-blue-600 p-1 shadow-[0_0_20px_rgba(0,229,255,0.2)]">
                            <img src="https://ui-avatars.com/api/?name=User&background=001529&color=fff" class="w-full h-full rounded-full bg-black object-cover" alt="Avatar">
                        </div>
                        <button class="text-xs bg-white/10 px-4 py-2 rounded-lg hover:bg-white/20 border border-white/5 transition">Changer l'image</button>
                    </div>
                    <div class="space-y-5">
                        <div>
                            <label class="text-[10px] uppercase font-bold text-gray-500 block mb-1.5 ml-1">Nom de l'organisation</label>
                            <input type="text" value="Maison Dupont" class="input-box">
                        </div>
                        <div>
                            <label class="text-[10px] uppercase font-bold text-gray-500 block mb-1.5 ml-1">Email Administrateur</label>
                            <input type="email" value="direction@dupont.com" class="input-box">
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-8">
                <div>
                    <div class="section-title">Plan & Usage</div>
                    <div class="bg-[#0F172A] border border-[#00E5FF]/30 p-8 rounded-3xl mb-6 relative overflow-hidden shadow-2xl">
                        <div class="absolute top-0 right-0 p-4 opacity-10 text-[#00E5FF]">
                            <svg class="w-24 h-24" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                            </svg>
                        </div>
                        
                        <div class="text-[10px] font-bold text-[#00E5FF] uppercase tracking-widest mb-1">Plan Actuel</div>
                        <div class="text-3xl font-black text-white mb-6 italic">PREMIUM</div>
                        
                        <div class="space-y-2">
                            <div class="flex justify-between text-[10px] font-mono">
                                <span class="text-gray-400">USAGE IA</span>
                                <span class="text-white">70%</span>
                            </div>
                            <div class="w-full bg-white/5 h-2 rounded-full overflow-hidden">
                                <div class="bg-gradient-to-r from-blue-500 to-[#00E5FF] w-[70%] h-full rounded-full shadow-[0_0_10px_#00E5FF]"></div>
                            </div>
                            <div class="text-[10px] text-gray-500 font-mono mt-1">Crédits restants : 300 / 1000</div>
                        </div>
                    </div>
                    <button class="group flex items-center gap-2 text-xs text-[#00E5FF] hover:text-white transition">
                        <span class="underline">Télécharger les factures (PDF)</span>
                        <span class="opacity-0 group-hover:opacity-100 transition-opacity">↗</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-16 pt-8 border-t border-white/10 flex justify-between items-center max-w-5xl">
            <p class="text-[10px] text-gray-600 font-mono italic">ID Client : EN-2026-X892</p>
            <button class="bg-[#00E5FF] text-black font-black uppercase text-xs tracking-widest px-10 py-4 rounded-full hover:bg-white hover:scale-105 transition-all shadow-lg active:scale-95" onclick="alert('Configuration enregistrée sur ENERGISTRAT V3')">
                Enregistrer les modifications
            </button>
        </div>
    </main>
</body>
</html>
