<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT V3 | OPH Cortex</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { abysse: '#050505', card: '#0F172A', oph: '#F97316', ai: '#D946EF', public: '#3B82F6', success: '#10B981', alert: '#EF4444', gold: '#FFD700' }, borderRadius: { 'bento': '2rem' }, boxShadow: { 'neon': '0 0 20px rgba(249, 115, 22, 0.25)' } } } }
    </script>
    <style>body { background: #050505; color: white; height: 100vh; overflow: hidden; display: flex; } .bento-card { background: #0F172A; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; } .bento-card:hover { border-color: rgba(249, 115, 22, 0.5); transform: translateY(-2px); z-index: 10; } .nav-item.active { background: rgba(249, 115, 22, 0.1); border-right: 3px solid #F97316; color: white; } .page-content { display: none; } .page-content.active { display: grid; }</style>
</head>
<body class="font-sans">
    <aside class="w-64 bg-[#020617] border-r border-white/5 flex flex-col justify-between h-full z-50">
        <div>
            <div class="p-6 flex items-center gap-3"><div class="w-10 h-10 rounded-full border-2 border-oph flex items-center justify-center bg-abysse text-oph font-bold shadow-neon">OPH</div><div><div class="font-black text-lg">CORTEX<span class="text-oph">.OPH</span></div><div class="text-[9px] text-gray-400">Bailleur Social</div></div></div>
            <nav class="mt-4 flex flex-col">
                <button onclick="navTo('cortex')" id="btn-cortex" class="nav-item active w-full text-left px-6 py-4 text-xs font-bold uppercase">1. Cortex Social</button>
                <button onclick="navTo('parc')" id="btn-parc" class="nav-item w-full text-left px-6 py-4 text-xs font-bold uppercase">2. Gestion Parc</button>
                <button onclick="navTo('marches')" id="btn-marches" class="nav-item w-full text-left px-6 py-4 text-xs font-bold uppercase">3. Marchés Publics</button>
                <button onclick="navTo('psp')" id="btn-psp" class="nav-item w-full text-left px-6 py-4 text-xs font-bold uppercase">4. Travaux & PSP</button>
            </nav>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-full bg-abysse relative">
        <header class="h-20 border-b border-white/5 flex items-center justify-between px-8 bg-abysse/95 backdrop-blur z-20"><h2 id="page-title" class="text-3xl font-black text-white">Cortex Social</h2><div class="text-xs text-gray-400 font-mono">Quittance: <span class="text-success">-2.4%</span></div></header>

        <main class="flex-1 overflow-y-auto p-8 scroll-smooth">
            <!-- CORTEX -->
            <div id="view-cortex" class="page-content active grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-4 bg-card rounded-bento p-6 border border-ai/20 bento-card h-[400px]">
                    <h3 class="font-bold text-lg text-white mb-4 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-ai animate-pulse"></span> Flux Neural</h3>
                    <div class="space-y-4">
                        <div class="bg-abysse/50 p-4 rounded-xl border border-alert/30"><div class="flex justify-between mb-2"><span class="text-[9px] bg-alert/20 text-alert px-2 rounded">RÉGULARISATION</span></div><p class="text-xs text-gray-300">Les Lilas : Risque régul > 150€.</p></div>
                    </div>
                </div>
                <div class="col-span-8 bg-gradient-to-br from-card to-abysse rounded-bento p-8 bento-card h-[400px]">
                    <h3 class="font-bold text-xl mb-6">Prédiction Charges</h3>
                    <canvas id="chargesChart" class="w-full h-64"></canvas>
                </div>
            </div>

            <!-- PARC -->
            <div id="view-parc" class="page-content grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-12 bg-card rounded-bento p-8 bento-card border-t-4 border-alert">
                    <h3 class="font-bold text-xl mb-6">Météo DPE</h3>
                    <div class="flex gap-2 items-end h-40">
                         <div class="flex-1 bg-green-500 h-[20%] rounded-t opacity-50"></div><div class="flex-1 bg-green-400 h-[40%] rounded-t"></div><div class="flex-1 bg-yellow-400 h-[60%] rounded-t"></div><div class="flex-1 bg-orange-500 h-[30%] rounded-t"></div><div class="flex-1 bg-red-600 h-[10%] rounded-t animate-pulse"></div>
                    </div>
                </div>
            </div>

            <!-- MARCHES -->
            <div id="view-marches" class="page-content grid grid-cols-12 gap-6 auto-rows-min">
                <div class="col-span-12 bg-card rounded-bento p-8 bento-card border-t-4 border-public">
                     <h3 class="font-bold text-xl mb-6">Accords Cadres</h3>
                     <div class="bg-abysse p-4 rounded-xl border border-alert/30 flex justify-between"><div><div class="text-xs text-gray-400 uppercase">Lot 2 • Gaz</div><div class="font-bold">TotalEnergies</div></div><span class="text-alert text-xs font-bold animate-pulse">Renouv. J-45</span></div>
                </div>
            </div>

             <!-- PSP -->
            <div id="view-psp" class="page-content grid grid-cols-12 gap-6 auto-rows-min">
                 <div class="col-span-12 bg-card rounded-bento p-8 bento-card border-l-4 border-gold">
                    <h3 class="font-bold text-xl mb-6">Plan Stratégique</h3>
                    <table class="w-full text-left text-xs text-gray-300"><tr class="border-b border-white/5"><td class="p-3">Réhab. Les Bleuets</td><td class="text-success">F ➔ C</td><td class="text-right text-gold">2.4 M€</td></tr></table>
                </div>
            </div>
        </main>
    </div>
    <script>
        function navTo(p){document.querySelectorAll('.nav-item').forEach(e=>{e.classList.remove('active');e.classList.add('text-gray-400')});document.getElementById('btn-'+p).classList.add('active');document.getElementById('btn-'+p).classList.remove('text-gray-400');document.querySelectorAll('.page-content').forEach(e=>e.classList.remove('active'));document.getElementById('view-'+p).classList.add('active'); if(p==='cortex')renderChart();}
        function renderChart(){const ctx=document.getElementById('chargesChart').getContext('2d');new Chart(ctx,{type:'line',data:{labels:['J','F','M','A','M','J'],datasets:[{label:'Projection',data:[100,95,90,60,50,40],borderColor:'#D946EF'}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{display:false},y:{display:false}}}});}
    </script>
</body>
</html>
