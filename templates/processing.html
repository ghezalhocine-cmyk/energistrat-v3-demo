<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Analyse IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>body{background:#050505;color:#00E5FF;font-family:'JetBrains Mono',monospace;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}</style>
</head>
<body>
    <div class="relative w-32 h-32 mb-8">
        <div class="absolute inset-0 border-4 border-cyan-900 rounded-full"></div>
        <div class="absolute inset-0 border-4 border-t-cyan-400 rounded-full animate-spin"></div>
    </div>
    <div class="text-xl font-bold mb-2 text-white">CORTEX<span class="text-cyan">.AI</span></div>
    <div id="log" class="text-xs text-gray-500 h-6">Initialisation...</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'citoyen';
        const logs = ["Connexion SGE Enedis...", "Récupération 24 mois d'historique...", "Analyse des courbes de charge...", "Détection des anomalies...", "Génération du Dashboard..."];
        let i = 0;
        
        setInterval(() => {
            if(i < logs.length) {
                document.getElementById('log').innerText = logs[i];
                i++;
            } else {
                window.location.href = role + '.html';
            }
        }, 800);
    </script>
</body>
</html>
