<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ENERGISTRAT — Analyse CORTEX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { background: #050505; color: #00E5FF; font-family: 'JetBrains Mono', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    .loader { width: 200px; height: 2px; background: rgba(0, 229, 255, 0.2); margin-top: 20px; position: relative; overflow: hidden; }
    .loader::after { content: ''; position: absolute; left: -50%; width: 50%; height: 100%; background: #00E5FF; animation: load 2s infinite linear; }
    @keyframes load { 0% { left: -50%; } 100% { left: 100%; } }
    .log-item { opacity: 0; animation: fadeUp 0.5s forwards; margin-bottom: 5px; font-size: 0.8rem; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
    <div class="text-4xl font-bold mb-2">CORTEX AI</div>
    <!-- Affichage dynamique du profil détecté pour confirmer que ça marche -->
    <div class="text-xs text-gray-500 mb-8 font-bold tracking-widest" id="profile-label">INITIALISATION...</div>
    
    <div class="loader"></div>
    <div id="logs" class="mt-8 text-center h-32 flex flex-col justify-end"></div>

    <script>
        // 1. Récupération du paramètre (target OU role)
        const urlParams = new URLSearchParams(window.location.search);
        let target = urlParams.get("target") || urlParams.get("role") || "citoyen";
        
        // Sécurité : on met tout en minuscule pour éviter les erreurs
        target = target.toLowerCase();

        // 2. CARTOGRAPHIE DES ROUTES (Les 9 Profils)
        const routes = {
            // Entreprises
            'industry': '/dashboard/industry',
            'retail':   '/dashboard/retail',
            'pme':      '/dashboard/pme',
            
            // Public
            'mairie':   '/dashboard/mairie',
            'sde':      '/dashboard/sde',
            'oph':      '/dashboard/oph',
            
            // Habitat & Partenaires
            'syndic':   '/dashboard/syndic',
            'citoyen':  '/dashboard/citoyen',
            'supplier': '/dashboard/supplier'
        };

        // 3. Détermination de l'URL finale
        // Si le profil est inconnu, on redirige vers Citoyen par sécurité
        const redirectUrl = routes[target] || '/dashboard/citoyen';

        // Mise à jour de l'affichage pour le debug visuel
        document.getElementById('profile-label').innerText = `CALIBRAGE PROFIL : ${target.toUpperCase()}`;

        // 4. Animation des Logs
        const messages = [
            "Connexion sécurisée aux API...",
            "Récupération des courbes de charge...",
            "Analyse des pics de puissance...",
            "Calcul du Score Vitality...",
            "Comparaison marchés Spot...",
            "Génération du Dashboard..."
        ];

        const logsDiv = document.getElementById('logs');
        let delay = 0;

        messages.forEach((msg, index) => {
            delay += Math.random() * 600 + 200; 
            setTimeout(() => {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerText = `> ${msg}`;
                logsDiv.appendChild(div);
                
                if (index === messages.length - 1) {
                    setTimeout(() => {
                        // LA REDIRECTION SE FAIT ICI
                        window.location.href = redirectUrl;
                    }, 1000);
                }
            }, delay);
        });
    </script>
</body>
</html>
