<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENERGISTRAT V3 | Partner Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
    <!-- Chart.js requis pour les graphs Risk -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="app-container">
        <!-- 1. SIDEBAR -->
        <nav class="sidebar">
            <div class="logo-area">V3</div>
            
            <div class="nav-item active" id="nav-risk" onclick="SupplierUI.switchTab('risk')" title="Risque & Churn">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <div class="nav-item" id="nav-deals" onclick="SupplierUI.switchTab('deals')" title="Flash Market">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <div class="nav-item" id="nav-pricing" onclick="SupplierUI.switchTab('pricing')" title="Barèmes">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
        </nav>

        <!-- 2. MAIN CONTENT -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1 id="page-title">Pilotage du Risque</h1>
                    <div style="font-size: 0.8rem; color: var(--c-text-muted); margin-top: 0.25rem;">
                        Portefeuille : <span class="text-supplier" style="font-weight:bold;">TotalEnergies Pro</span>
                    </div>
                </div>
                <button class="action-btn secondary" style="width: auto; padding: 0.5rem 1rem; font-size: 0.8rem;">
                    Export PDF
                </button>
            </header>

            <!-- Les vues sont injectées ici par JS -->
            <div id="content-area"></div>
        </main>

        <!-- 3. CORTEX PANEL (Right) -->
        <aside class="cortex-panel">
            <div class="cortex-header">
                <div class="cortex-avatar"></div>
                <div>
                    <div style="font-weight: 800; font-size: 1.1rem;">CORTEX</div>
                    <div style="font-size: 0.7rem; color: var(--c-text-muted);">Partner Advisor</div>
                </div>
            </div>
            
            <div id="cortex-feed" style="flex: 1; overflow-y: auto;">
                <!-- Messages IA injectés ici -->
            </div>

            <div style="margin-top: 1rem;">
                <input type="text" placeholder="Interroger Cortex..." 
                       style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 0.8rem; border-radius: 0.5rem; color: white; outline: none;">
            </div>
        </aside>
    </div>

    <!-- SCRIPTS -->
    <script src="../static/js/data.supplier.mock.js"></script>
    <script src="../static/js/supplier.ui.js"></script>
    <script src="../static/js/supplier.risk.js"></script>
    <script src="../static/js/supplier.deals.js"></script>
    <script src="../static/js/supplier.pricing.js"></script>
    <script src="../static/js/main.supplier.js"></script>
</body>
</html>
