<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>ENERGISTRAT V3 | Industry Command</title>
    
    <!-- LIBS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- CORE ENGINE UX -->
    <script src="/static/js/main.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = { theme: { extend: { colors: { abysse: '#050505', card: '#0F172A', cyan: '#00E5FF', alert: '#F59E0B', danger: '#EF4444', ai: '#A855F7' }, borderRadius: { 'bento': '2rem' } } } }
    </script>
    <style>
        body { background-color: #050505; color: white; }
        .bento-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .page-content { display: none; } .page-content.active { display: grid; }
        .nav-item.active { border-left: 3px solid #00E5FF; background: rgba(0, 229, 255, 0.1); color: white; }
    </style>
</head>
<body class="flex h-screen w-screen overflow-hidden text-sm font-sans">

    <!-- SIDEBAR -->
    <aside class="w-72 bg-[#020617] border-r border-white/5 flex flex-col justify-between z-50 flex-shrink-0">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-12 h-12 rounded-2xl border border-cyan/50 flex items-center justify-center bg-abysse text-cyan font-bold shadow-[0_0_20px_rgba(0,229,255,0.2)]">
                    <i class="fa-solid fa-industry text-xl"></i>
                </div>
                <div><h1 class="font-black tracking-wider text-base">FACTORY<span class="text-cyan">.OS</span></h1><p class="text-[10px] text-gray-500">Site Seveso • ISO 50001</p></div>
            </div>
            <nav class="space-y-1">
                <button onclick="navTo('command')" id="btn-command" class="nav-item active w-full text-left px-6 py-4 text-gray-400 font-bold uppercase tracking-wide transition flex items-center gap-3 hover:bg-white/5"><i class="fa-solid fa-tower-broadcast w-5"></i> Command Center</button>
                <button onclick="navTo('trading')" id="btn-trading" class="nav-item w-full text-left px-6 py-4 text-gray-400 font-bold uppercase tracking-wide transition flex items-center gap-3 hover:bg-white/5"><i class="fa-solid fa-chart-line w-5"></i> Trading & Budget</button>
            </nav>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col relative bg-abysse overflow-hidden">
        
        <!-- HEADER -->
        <div class="h-14 border-b border-white/5 flex items-center px-8 gap-4 bg-abysse/95 backdrop-blur z-20 justify-between">
            <div class="flex items-center gap-4">
                <div class="px-2 py-1 rounded bg-cyan text-abysse text-[10px] font-black animate-pulse tracking-wider">LIVE DATA</div>
                <span class="text-xs text-gray-400 font-mono" id="data-source-indicator">En attente flux...</span>
            </div>
            <div class="flex gap-4">
                <div class="text-right">
                    <div class="text-[10px] text-gray-500 uppercase font-bold">Puissance Max</div>
                    <div class="text-sm font-mono font-bold text-white" id="header-pmax">-- kW</div>
                </div>
                <div class="text-right">
                    <div class="text-[10px] text-gray-500 uppercase font-bold">Volume Annuel</div>
                    <div class="text-sm font-mono font-bold text-cyan" id="header-vol">-- MWh</div>
                </div>
            </div>
        </div>

        <div class="p-8 overflow-y-auto h-full pb-20 scroll-smooth">
            
            <!-- VIEW COMMAND -->
            <div id="view-command" class="page-content active grid grid-cols-12 gap-6 auto-rows-min">
                
                <!-- MAIN LOAD CURVE -->
                <div class="col-span-8 bg-card rounded-[2rem] p-8 bento-card">
                    <div class="flex justify-between mb-6">
                        <h3 class="font-bold text-xl text-white">Courbe de Charge (P10)</h3>
                        <div class="flex gap-4 text-xs font-mono">
                            <span class="text-cyan">● Réel (kW)</span>
                        </div>
                    </div>
                    <div class="h-72 w-full relative">
                        <canvas id="chartLoad"></canvas>
                    </div>

                    <!-- AI INSIGHT -->
                    <div class="mt-6 p-4 bg-abysse/50 border border-ai/30 rounded-xl flex items-start gap-4 shadow-[0_0_20px_rgba(168,85,247,0.1)]">
                        <div class="w-10 h-10 rounded-full bg-ai/10 flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid fa-robot text-ai animate-pulse"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-ai uppercase mb-1">Analyse Cortex</h4>
                            <p class="text-sm text-gray-300 italic leading-relaxed" id="ai-insight-text">
                                Initialisation...
                            </p>
                        </div>
                    </div>
                </div>

                <!-- KPI WIDGETS -->
                <div class="col-span-4 flex flex-col gap-6">
                    <div class="bento-card rounded-[2rem] p-6 flex-1 border-l-4 border-cyan">
                        <h3 class="font-bold text-lg text-white mb-4">Talon de Consommation</h3>
                        <div class="text-4xl font-bold text-white mb-2" id="kpi-talon">-- <span class="text-sm text-gray-500">kW</span></div>
                        <p class="text-xs text-gray-400">Consommation incompressible (Nuit/WE).</p>
                    </div>
                    
                    <!-- Qualité Réseau -->
                    <div class="bento-card rounded-[2rem] p-6 flex-1">
                        <h3 class="font-bold text-lg text-white mb-4">Qualité Réseau (Cos φ)</h3>
                        <div class="flex items-center justify-between">
                            <div class="relative w-24 h-24">
                                <svg class="w-full h-full" viewBox="0 0 36 36">
                                    <path class="text-gray-700" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" />
                                    <path class="text-cyan" stroke-dasharray="94, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" />
                                </svg>
                                <div class="absolute inset-0 flex items-center justify-center flex-col">
                                    <span class="text-xl font-bold text-white font-mono">0.94</span>
                                </div>
                            </div>
                            <div class="text-right space-y-2">
                                <div class="text-xs text-gray-400">Pénalité</div>
                                <div class="text-sm font-bold text-green-400">0 €</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- VARIABLE GLOBALE CHART ---
        var mainChart = null;

        // --- 1. INITIALISATION DU GRAPHIQUE (VIDE AU DEPART) ---
        function initChart() {
            const ctx = document.getElementById('chartLoad').getContext('2d');
            
            // Dégradé Cyberpunk
            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(0, 229, 255, 0.4)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');

            mainChart = new Chart(ctx, {
                type: 'line',
                data: {
                    // Données placeholder initiales (pour que le chart existe)
                    labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00'],
                    datasets: [{
                        label: 'Puissance (kW)',
                        data: [0, 0, 0, 0, 0, 0], 
                        borderColor: '#00E5FF',
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.2, // Ligne un peu tendue pour le réalisme
                        borderWidth: 2,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#64748B', maxTicksLimit: 8 } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748B' } }
                    },
                    animation: { duration: 1000 }
                }
            });
            console.log("📊 Graphique initialisé (Vide).");
        }

        // --- 2. FONCTION DE MISE A JOUR ---
        function updateGraphData(labels, values) {
            if (!mainChart) return;
            
            console.log("🔄 Mise à jour du graphique avec " + values.length + " points...");
            
            // On remplace les données
            mainChart.data.labels = labels;
            mainChart.data.datasets[0].data = values;
            
            // On redessine
            mainChart.update();
        }

        // --- 3. PONT DE DONNÉES (RÉCUPÉRATION JSON) ---
        async function loadRealData() {
            try {
                // Appel API vers le fichier JSON généré par Ops
                const response = await fetch('/api/data/industry');
                const result = await response.json();

                if (result.found && result.data.success) {
                    const data = result.data;
                    console.log("✅ DONNÉES REÇUES !", data);

                    // A. MAJ TEXTES
                    document.getElementById('header-pmax').innerText = data.kpi.pic_kw + " kW";
                    document.getElementById('header-vol').innerText = data.kpi.volume_mwh + " MWh";
                    document.getElementById('kpi-talon').innerHTML = data.kpi.talon_kw + ' <span class="text-sm text-gray-500">kW</span>';
                    
                    document.getElementById('data-source-indicator').innerText = "Source: Données Réelles SGE";
                    document.getElementById('data-source-indicator').className = "text-xs text-green-400 font-mono font-bold";

                    // B. MAJ IA
                    if(data.ai_insight) {
                        const aiBox = document.getElementById('ai-insight-text');
                        aiBox.innerHTML = data.ai_insight.replace(/\n/g, "<br>");
                        aiBox.classList.remove('italic', 'text-gray-300');
                        aiBox.classList.add('text-white');
                    }

                    // C. MAJ GRAPHIQUE (CRUCIAL)
                    if (data.chart && data.chart.values.length > 0) {
                        updateGraphData(data.chart.labels, data.chart.values);
                        App.toast('Courbe de charge synchronisée.', 'success');
                    } else {
                        console.warn("Données graphiques vides dans le JSON");
                    }

                } else {
                    console.log("Mode Démo (Pas de fichier JSON)");
                    // Optionnel : Charger des données fake pour la démo
                }
            } catch (e) {
                console.error("Erreur Pont:", e);
            }
        }

        // --- 4. LANCEMENT ---
        document.addEventListener('DOMContentLoaded', () => {
            initChart(); // D'abord on crée le chart vide
            
            // Petit délai pour être sûr que tout est chargé
            setTimeout(() => {
                loadRealData(); // Ensuite on va chercher les données
            }, 500);
        });

        function navTo(page) { console.log(page); }
    </script>
</body>
</html>
