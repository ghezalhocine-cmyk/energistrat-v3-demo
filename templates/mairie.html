<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENERGISTRAT V3 | Hub Collectivité</title>
    
    <!-- LIBS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/main.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = { theme: { extend: { colors: { abysse: '#050505', card: '#0F172A', mairie: '#3B82F6', cyan: '#00E5FF', cortex: '#EC4899', success: '#10B981', alert: '#EF4444', gold: '#F59E0B' }, borderRadius: { 'bento': '1.5rem' } } } }
    </script>

    <style>
        body { background-color: #050505; color: #e2e8f0; overflow: hidden; }
        .bento-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .nav-tab.active { background: linear-gradient(90deg, rgba(59, 130, 246, 0.1) 0%, transparent 100%); border-left: 3px solid #3B82F6; color: white; }
        .tab-content { display: none; } .tab-content.active { display: grid; }
    </style>
</head>
<body class="flex h-screen w-screen font-sans relative">

    <!-- SIDEBAR -->
    <aside class="w-72 bg-[#020617]/90 backdrop-blur-md border-r border-white/5 flex flex-col justify-between z-50 h-full">
        <div>
            <div class="p-8 flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl border border-mairie/50 flex items-center justify-center bg-abysse text-mairie">
                    <i class="fa-solid fa-landmark text-xl"></i>
                </div>
                <div>
                    <div class="font-black text-lg tracking-tight text-white">MAIRIE<span class="text-mairie">.OS</span></div>
                    <div class="text-[10px] text-slate-500 font-mono uppercase tracking-widest">Saint-Lys • 31470</div>
                </div>
            </div>
            <nav class="flex flex-col gap-2 mt-4">
                <button onclick="switchTab('patrimoine')" id="nav-patrimoine" class="nav-tab active w-full text-left px-8 py-4 text-sm font-medium text-slate-400 flex items-center gap-4"><i class="fa-solid fa-city w-5"></i> Patrimoine</button>
                <button onclick="switchTab('budget')" id="nav-budget" class="nav-tab w-full text-left px-8 py-4 text-sm font-medium text-slate-400 flex items-center gap-4"><i class="fa-solid fa-chart-pie w-5"></i> Budget M57</button>
            </nav>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col h-full relative z-10 overflow-hidden">
        
        <!-- HEADER -->
        <header class="h-20 border-b border-white/5 flex items-center justify-between px-10 bg-abysse/80 backdrop-blur-md z-20">
            <div class="flex items-center gap-4">
                <div class="px-3 py-1 rounded-full bg-cortex/10 border border-cortex/20 text-cortex text-[10px] font-bold animate-pulse">
                    <i class="fa-solid fa-brain mr-2"></i>CORTEX LIVE
                </div>
                <span class="text-xs text-slate-300 font-mono" id="ai-insight-header">En attente de flux SGE...</span>
            </div>
            <div class="text-right hidden md:block">
                <div class="text-[10px] text-slate-500 font-bold uppercase">Volume Annuel</div>
                <div class="text-lg text-white font-mono font-bold" id="header-vol">-- MWh</div>
            </div>
        </header>

        <!-- CONTENT -->
        <div class="flex-1 overflow-y-auto p-10 scroll-smooth pb-20">

            <!-- TAB 1: PATRIMOINE -->
            <div id="tab-patrimoine" class="tab-content active grid-cols-12 gap-6">
                <!-- KPI -->
                <div class="col-span-12 grid grid-cols-4 gap-6 mb-2">
                    <div class="bento-card rounded-bento p-6">
                        <div class="text-slate-400 text-xs uppercase font-bold mb-2">Pic Puissance</div>
                        <div class="text-3xl font-bold text-white mb-1" id="kpi-pic">-- <span class="text-sm">kW</span></div>
                    </div>
                    <div class="bento-card rounded-bento p-6 border-l-4 border-alert">
                        <div class="text-slate-400 text-xs uppercase font-bold mb-2">Talon Nuit</div>
                        <div class="text-3xl font-bold text-white mb-1" id="kpi-talon">-- <span class="text-sm">kW</span></div>
                        <div class="text-xs text-alert">Gaspillage possible</div>
                    </div>
                </div>

                <!-- MAIN CHART -->
                <div class="col-span-8 bento-card rounded-bento p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-bold text-white">Courbe de Charge (SGE)</h3>
                    </div>
                    <div class="h-64 w-full relative"><canvas id="chartPatrimoine"></canvas></div>
                </div>

                <!-- CORTEX ANALYSIS -->
                <div class="col-span-4 bento-card rounded-bento p-8 flex flex-col bg-gradient-to-b from-card to-cortex/10 border-t-4 border-cortex">
                    <h3 class="text-xl font-bold text-white mb-6">Analyse Politique</h3>
                    <p class="text-sm text-gray-300 leading-relaxed" id="ai-insight-text">
                        En attente d'analyse...
                    </p>
                </div>
            </div>

            <!-- TAB 2: BUDGET (Placeholder) -->
            <div id="tab-budget" class="tab-content grid-cols-12 gap-6">
                <div class="col-span-12 bento-card rounded-bento p-8 text-center">
                    <h3 class="text-white">Module Budget M57</h3>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- 1. CHART SETUP ---
        let chartPatrimoineInstance = null;

        function initChart() {
            const ctx = document.getElementById('chartPatrimoine').getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(59, 130, 246, 0.2)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');

            chartPatrimoineInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Puissance (kW)',
                        data: [],
                        borderColor: '#3B82F6', // Bleu Mairie
                        backgroundColor: gradient,
                        fill: true,
                        tension: 0.2,
                        pointRadius: 0,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#64748B' } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748B' } }
                    }
                }
            });
        }

        // --- 2. BRIDGE LOGIC (CONNEXION OPS) ---
        async function loadRealData() {
            try {
                // On appelle l'API pour récupérer le fichier "mairie.json" créé par l'Ops
                const response = await fetch('/api/data/mairie');
                const result = await response.json();

                if (result.found && result.data.success) {
                    const data = result.data;
                    console.log("✅ DONNÉES MAIRIE REÇUES :", data);

                    // A. Mise à jour KPI
                    document.getElementById('header-vol').innerText = data.kpi.volume_mwh + " MWh";
                    document.getElementById('kpi-pic').innerText = data.kpi.pic_kw;
                    document.getElementById('kpi-talon').innerText = data.kpi.talon_kw;

                    // B. Mise à jour IA (Header + Box)
                    if (data.ai_insight) {
                        const cleanText = data.ai_insight.replace(/\n/g, "<br>");
                        document.getElementById('ai-insight-text').innerHTML = cleanText;
                        document.getElementById('ai-insight-header').innerText = "Analyse terminée.";
                        document.getElementById('ai-insight-header').classList.add('text-green-400');
                    }

                    // C. Mise à jour Graphique
                    if (chartPatrimoineInstance && data.chart.values.length > 0) {
                        chartPatrimoineInstance.data.labels = data.chart.labels;
                        chartPatrimoineInstance.data.datasets[0].data = data.chart.values;
                        chartPatrimoineInstance.update();
                        App.toast('Données Mairie synchronisées.', 'success');
                    }
                }
            } catch (e) {
                console.log("Pas de données Mairie.");
            }
        }

        // --- 3. INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            switchTab('patrimoine');
            initChart();
            setTimeout(loadRealData, 500); // Délai pour laisser le temps au chart de se créer
        });

        function switchTab(tabId) {
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-' + tabId).classList.add('active');
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
        }
    </script>
</body>
</html>
