<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{background:#050505;color:white;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;}</style>
</head>
<body>
    <div class="w-full max-w-md p-8 bg-[#0F172A] rounded-[2rem] border border-white/10 text-center">
        <div id="icon" class="text-4xl mb-4">⚡</div>
        <h1 class="text-2xl font-black mb-2" id="title">Bienvenue</h1>
        <p class="text-gray-400 text-sm mb-8">Connectez votre espace sécurisé.</p>
        
        <div class="space-y-4 text-left">
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-500 ml-2">Identifiant (Email / SIRET)</label>
                <input type="text" class="w-full bg-[#1E293B] border border-white/10 rounded-xl p-3 text-sm focus:border-white outline-none">
            </div>
            <div>
                <label class="text-[10px] uppercase font-bold text-gray-500 ml-2">Mot de passe</label>
                <input type="password" value="password" class="w-full bg-[#1E293B] border border-white/10 rounded-xl p-3 text-sm focus:border-white outline-none">
            </div>
            <div class="flex items-center gap-2 pt-2">
                <input type="checkbox" id="rgpd" class="rounded bg-[#1E293B] border-white/10">
                <label for="rgpd" class="text-xs text-gray-400">J'autorise la collecte des données SGE (RGPD)</label>
            </div>
        </div>

        <button onclick="go()" class="w-full mt-8 bg-white text-black font-bold py-3 rounded-xl hover:scale-105 transition">Connexion</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'citoyen';
        
        const configs = {
            'mairie': {t:'Portail Mairie', i:'🏛️'}, 'sde': {t:'Supervision SDE', i:'🌍'},
            'oph': {t:'Bailleur Social', i:'🏘️'}, 'syndic': {t:'Syndic Copro', i:'🏢'},
            'retail': {t:'Grands Comptes', i:'🛍️'}, 'industry': {t:'Industrie 4.0', i:'🏭'},
            'pme': {t:'Espace Pro', i:'🥖'}, 'citoyen': {t:'Mon Foyer', i:'🏠'},
            'supplier': {t:'Partenaire', i:'⚡'}, 'ops': {t:'Admin Ops', i:'🚀'}
        };

        if(configs[role]) {
            document.getElementById('title').innerText = configs[role].t;
            document.getElementById('icon').innerText = configs[role].i;
        }

        function go() {
            if(!document.getElementById('rgpd').checked) return alert("Veuillez accepter le RGPD.");
            window.location.href = 'processing.html?role=' + role;
        }
    </script>
</body>
</html>
