<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ENERGISTRAT V3 - Onboarding</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body{background:#050505;color:#fff;font-family:Inter,sans-serif}
.step-container{display:none}
.step-container.active{display:block}
</style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-md bg-[#0F172A] p-8 rounded-3xl border border-white/10">

<!-- HEADER -->
<div class="text-center mb-6">
  <h1 id="header-title" class="text-2xl font-black">Espace Énergie</h1>
  <p class="text-xs text-gray-400">Connexion sécurisée & Audit</p>
</div>

<!-- STEP 0 : CHOIX PROFIL -->
<div id="step-0" class="step-container active">
  <h2 class="font-bold text-center mb-4">Choisissez votre espace</h2>

  <button onclick="selectRole('pme')" class="w-full mb-3 p-4 rounded-xl bg-[#1E293B] border border-white/10">
    PME / Industrie
  </button>

  <button onclick="selectRole('public')" class="w-full mb-3 p-4 rounded-xl bg-[#1E293B] border border-white/10">
    Collectivité / OPH
  </button>

  <button onclick="selectRole('citizen')" class="w-full p-4 rounded-xl bg-[#1E293B] border border-white/10">
    Particulier
  </button>
</div>

<!-- STEP 1 AUTH -->
<div id="step-1" class="step-container">
  <button onclick="nextStep(2)" class="w-full mt-6 bg-cyan-400 text-black font-bold py-3 rounded-xl">
    Se connecter
  </button>
</div>

<!-- STEP 2 CHOIX MÉTHODE -->
<div id="step-2" class="step-container">
  <h2 class="font-bold text-center mb-4">Méthode</h2>
  <button onclick="nextStep(3)" class="w-full p-3 bg-[#1E293B] rounded-xl">Saisie manuelle</button>
</div>

<!-- STEP 3 DONNÉES -->
<div id="step-3" class="step-container">
  <input id="input-email-holder" placeholder="Email titulaire" class="w-full p-3 rounded-xl mb-3 bg-[#1E293B]">
  <input id="input-zip" placeholder="Code Postal" class="w-full p-3 rounded-xl mb-3 bg-[#1E293B]">
  <button onclick="nextStep(4)" class="w-full py-3 bg-white text-black rounded-xl font-bold">Suivant</button>
</div>

<!-- STEP 4 CONSENTEMENT -->
<div id="step-4" class="step-container">
  <label class="flex gap-2 text-xs text-gray-400">
    <input type="checkbox" id="consent-check">
    J'autorise ENERGISTRAT à accéder aux données GRD
  </label>

  <button onclick="submitFinal()" class="w-full mt-6 py-3 bg-cyan-400 text-black rounded-xl font-black">
    Lancer l'audit
  </button>
</div>

</div>

<script>
let currentRole = null;
let currentStep = 0;

function showStep(step){
  document.querySelectorAll('.step-container').forEach(s=>s.classList.remove('active'));
  document.getElementById(`step-${step}`).classList.add('active');
  currentStep = step;
}

function nextStep(step){ showStep(step); }

function selectRole(role){
  currentRole = role;
  showStep(1);
}

/* 🔥 FONCTION STRATÉGIQUE */
function submitFinal(){

  const consent = document.getElementById('consent-check').checked;
  if(!consent){
    alert("Consentement obligatoire.");
    return;
  }

  const profilePayload = {
    role: currentRole,
    source: "onboarding",
    consent: true,
    email: document.getElementById('input-email-holder').value,
    zip: document.getElementById('input-zip').value,
    timestamp: Date.now()
  };

  // 🔹 stockage pour le dashboard & moteur IA
  localStorage.setItem("energistrat_profile", JSON.stringify(profilePayload));

  console.log("Profil prêt pour moteur IA:", profilePayload);

  // 🔹 redirection processing
  window.location.href = `processing.html?role=${encodeURIComponent(currentRole)}`;
}

showStep(0);
</script>

</body>
</html>
